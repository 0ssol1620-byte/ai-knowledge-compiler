defaults:
  language: en
  alternate_language: ko
  accessibility: WCAG_2_2_AA
  required_viewports: [1920, 1440, 1280, 1024, 768, 390, 360]
  required_states: [default, mobile, reduced_motion]

status_semantics:
  complete: >-
    Implemented and locally verified in the repository. This does not imply
    production deployment, legal clearance, commercial approval, or field SLO
    evidence.
  partial: >-
    The named surface and honest unavailable states are implemented, but a
    declared live dependency or end-to-end evidence gate remains. Partial must
    never be presented as production-ready or as completed processing.

release_review:
  reviewed_at: 2026-07-31
  state: repository_release_candidate
  current_evidence:
    eslint: pass
    typescript: pass
    production_build: pass
    vitest: 72_passed
    playwright: 24_passed_4_intentional_skips
    enabled_dead_buttons: 0
    asset_manifest: 9_verified
    asset_names: 119_verified
    asset_hashes: 21_verified
  external_gates:
    - legal_and_domain_clearance
    - approved_commercial_price_book
    - consented_customer_evidence
    - rights_cleared_real_benchmark_evidence
    - production_provider_configuration
    - deployed_security_and_field_performance_evidence

