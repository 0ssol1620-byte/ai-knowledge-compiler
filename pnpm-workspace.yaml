packages:
  - "apps/*"
  - "packages/*"

overrides:
  brace-expansion: 5.0.8
  postcss: 8.5.24
  sharp: 0.35.3

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - jsdom@30.0.1

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "sharp"
