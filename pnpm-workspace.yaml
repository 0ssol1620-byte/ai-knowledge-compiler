packages:
  - "apps/*"
  - "packages/*"

overrides:
  # These close transitive dependency advisories; none is a direct dependency.
  #   brace-expansion  <5.0.9   via eslint and @lhci/cli
  #   js-yaml          <4.3.2   via eslint
  #   tmp              <0.2.7   via @lhci/cli
  #   nanoid           <3.3.18  via postcss, which next and vite both pull in
  # The previous brace-expansion pin (5.0.8) was itself inside the vulnerable
  # range the advisory names.
  brace-expansion: 5.0.9
  js-yaml: 4.3.2
  tmp: 0.2.7
  nanoid: ^3.3.18
  uuid: ^11.1.1
  postcss: 8.5.24
  sharp: 0.35.4
  qs: 6.16.0
  image-size: 2.0.4
  # Lighthouse CI's older Puppeteer 24 tree pulls vulnerable extract-zip.
  # Share the Puppeteer 25 core already used by impeccable. LHCI collection
  # and assertions pass for four routes and twelve runs with this override.
  puppeteer-core: 25.5.0
  # Puppeteer 25's browser helper requires proxy-agent 8 as a peer.
  proxy-agent: 8.0.2

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

allowBuilds:
  esbuild: true
  # impeccable lists puppeteer as an optional dependency and only needs it to
  # scan live URLs. The checker runs over source files, and browser-rendered
  # checks already have Playwright's pinned Chromium, so the Chrome download is
  # skipped.
  puppeteer: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - jsdom@30.0.1

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "sharp"
