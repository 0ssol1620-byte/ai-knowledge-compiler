schema_version: "6.0.0"
mode: contract_only_no_endpoint_created
defaults:
  queue_based: true
  provider_retry_count: 0
  min_workers: 0
  flashboot: true
  auto_scale_down: true
  delete_temporary_endpoint_after_evidence: true
  allow_inline_input: false
  callback_auth_required: true
  ground_truth_mount: forbidden
  customer_data_on_model_cache_volume: forbidden
  idempotency_required: true
  orphan_audit_required: true
  cost_is_mandatory_test_blocker: false
  runaway_hard_stop_multiplier: 3
  secret_values_in_registry: forbidden

pools:
  - id: parser-mineru-3-4-4
    model_family: mineru
    candidate_ids: [mineru-3.4.4-pipeline, mineru-3.4.4-hybrid-medium, mineru-3.4.4-hybrid-high, mineru-3.4.4-vlm]
    enabled: false
    identity_state: pending_exact_image_digest
    image_digest: null
    gpu_classes: [L4, RTX_4090_PRO, A6000, A100_80GB]
    min_workers: 0
    max_workers: 8
    provider_retry_count: 0
    secret_names: [HF_TOKEN, CALLBACK_HMAC_SECRET]
    cache_namespace: mineru-3-4-4

