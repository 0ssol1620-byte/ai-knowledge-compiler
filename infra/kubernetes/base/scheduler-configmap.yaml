apiVersion: v1
kind: ConfigMap
metadata:
  name: akc-scheduler-runtime
data:
  AKC_ENV: production
  AKC_LOG_LEVEL: INFO
  AKC_METRICS_ENABLED: "true"
  AKC_METRICS_BIND_HOST: 0.0.0.0
  AKC_METRICS_PORT: "9100"
  AKC_SCHEDULER_DATABASE_ROLE: akc_scheduler
  AKC_SCHEDULER_POLL_INTERVAL_SECONDS: "0.5"
  AKC_SCHEDULER_BATCH_SIZE: "50"
  AKC_WEBHOOK_DELIVERY_ENABLED: "true"
  AKC_WEBHOOK_ALLOWED_HOSTS: webhook-receiver.example.invalid
  AKC_WEBHOOK_MAX_ATTEMPTS: "6"
  AKC_WEBHOOK_RETRY_SCHEDULE_SECONDS: "60,300,1800,7200,43200"
  AKC_WEBHOOK_MAX_ENDPOINTS_PER_TENANT: "20"
  AKC_WEBHOOK_BACKOFF_BASE_SECONDS: "2"
  AKC_WEBHOOK_BACKOFF_MAX_SECONDS: "3600"
  AKC_WEBHOOK_BACKOFF_JITTER_RATIO: "0.2"
  AKC_WEBHOOK_CONNECT_TIMEOUT_SECONDS: "5"
  AKC_WEBHOOK_READ_TIMEOUT_SECONDS: "10"
  AKC_WEBHOOK_ATTEMPT_TIMEOUT_SECONDS: "20"
  AKC_WEBHOOK_CONFIGURATION_RETRY_SECONDS: "60"
  AKC_WEBHOOK_MAX_RETRY_AFTER_SECONDS: "86400"
  AKC_WEBHOOK_MAX_REDIRECTS: "3"
  AKC_SCHEDULER_RETENTION_INTERVAL_SECONDS: "3600"
  AKC_EVENT_RETENTION_DAYS: "7"
  AKC_SCHEDULER_CLEANUP_BATCH_SIZE: "1000"
  AKC_OUTBOX_RETENTION_DAYS: "7"
  AKC_DISPATCH_DEAD_LETTER_RETENTION_DAYS: "30"
  AKC_WEBHOOK_DELIVERY_RETENTION_DAYS: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: akc-dispatch-runtime
data:
  AKC_ENV: production
  AKC_LOG_LEVEL: INFO
  AKC_METRICS_ENABLED: "true"
  AKC_METRICS_BIND_HOST: 0.0.0.0
  AKC_METRICS_PORT: "9100"
  AKC_DISPATCH_DATABASE_ROLE: akc_dispatch_worker
  AKC_SCHEDULER_POLL_INTERVAL_SECONDS: "0.5"
  AKC_SCHEDULER_BATCH_SIZE: "10"
  AKC_DISPATCH_MAX_ATTEMPTS: "5"
  AKC_DISPATCH_LEASE_SECONDS: "900"
  AKC_DISPATCH_ATTEMPT_TIMEOUT_SECONDS: "300"
  AKC_DISPATCH_BACKOFF_BASE_SECONDS: "2"
  AKC_DISPATCH_BACKOFF_MAX_SECONDS: "300"
  AKC_DISPATCH_BACKOFF_JITTER_RATIO: "0.2"
  AKC_DISPATCH_FAIRNESS_SCAN_TENANTS: "64"
  AKC_DISPATCH_TENANT_BUSY_DELAY_SECONDS: "1"
  AKC_DISPATCH_PAUSED_DELAY_SECONDS: "15"
  # Enable atomically with API semantic retrieval and both shared HMAC/provider Secrets.
  AKC_COLLECTION_FINALIZER_ENABLED: "false"
  AKC_COLLECTION_FINALIZER_API_URL: http://akc-api:8000/v1/internal/collections/finalize
  AKC_COLLECTION_FINALIZER_TIMEOUT_SECONDS: "300"
  AKC_KNOWLEDGE_PROVIDER: qwen_durable
  AKC_QWEN_ENDPOINT_ID: knowledge-standard
  AKC_QWEN_PROVIDER_KEY: qwen3_5_4b
  # Environment overlays MUST replace these release placeholders together.
  AKC_QWEN_MODEL_REVISION: "1111111111111111111111111111111111111111"
  AKC_QWEN_RUNTIME_IMAGE_DIGEST: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
  AKC_QWEN_ADAPTER_VERSION: qwen-adapter-1.0.0
  AKC_QWEN_PROMPT_REVISION: "sha256:43ed1d6e77c01e250ffdfaaa6a8eeb1535817ba5b9ef1b59187b6b4b4bbd7c21"
  AKC_QWEN_KNOWLEDGE_SCHEMA_SHA256: "sha256:9ea7e6d7270b1dc7111afe7ca634ca0562a6607cba1b48bfcafb5df6cfa8ed4f"
  AKC_QWEN_MAX_ATTEMPTS: "3"
  AKC_OBJECT_STORE_DRIVER: s3
  AKC_S3_USE_AMBIENT_CREDENTIALS: "true"
  AKC_S3_ENDPOINT_URL: https://replace-with-provider-reachable-object-store-host
  AKC_S3_REGION: ap-northeast-2
  AKC_S3_BUCKET_QUARANTINE: replace-with-quarantine-bucket
  AKC_S3_BUCKET_SOURCE: replace-with-source-bucket
  AKC_S3_BUCKET_WORKING: replace-with-working-bucket
  AKC_S3_BUCKET_DERIVED: replace-with-derived-bucket
  AKC_S3_BUCKET_EXPORTS: replace-with-exports-bucket
  AKC_S3_BUCKET_AUDIT: replace-with-audit-bucket
  AKC_PRIVATE_MODE: "true"
  AKC_EXTERNAL_OCR_ENABLED: "false"
  AKC_WEBHOOK_DELIVERY_ENABLED: "false"
