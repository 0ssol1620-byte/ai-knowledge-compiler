apiVersion: v1
kind: ConfigMap
metadata:
  name: akc-analysis-runtime
data:
  AKC_ENV: production
  AKC_LOG_LEVEL: INFO
  AKC_ANALYSIS_DATABASE_ROLE: akc_analysis_worker
  AKC_DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
  AKC_DATABASE_POOL_TIMEOUT_SECONDS: "5"
  AKC_DATABASE_COMMAND_TIMEOUT_SECONDS: "330"
  AKC_DATABASE_STATEMENT_TIMEOUT_MS: "325000"
  AKC_DATABASE_LOCK_TIMEOUT_MS: "5000"
  AKC_DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "340000"
  AKC_OBJECT_STORE_DRIVER: s3
  AKC_S3_USE_AMBIENT_CREDENTIALS: "false"
  AKC_S3_ENDPOINT_URL: https://akc-object-store.akc-infrastructure.svc:443
  AKC_S3_REGION: ap-northeast-2
  AKC_S3_BUCKET_QUARANTINE: replace-with-quarantine-bucket
  AKC_S3_BUCKET_SOURCE: replace-with-source-bucket
  AKC_S3_BUCKET_WORKING: replace-with-working-bucket
  AKC_S3_BUCKET_DERIVED: replace-with-derived-bucket
  AKC_S3_BUCKET_EXPORTS: replace-with-exports-bucket
  AKC_S3_BUCKET_AUDIT: replace-with-audit-bucket
  AKC_MAX_UPLOAD_BYTES: "1073741824"
  AKC_ANALYSIS_MAX_SOURCE_BYTES: "268435456"
  AKC_MAX_PAGES: "500"
  AKC_MAX_ARCHIVE_FILES: "2000"
  AKC_MAX_ARCHIVE_UNCOMPRESSED_BYTES: "262144000"
  AKC_MAX_ARCHIVE_RATIO: "100"
  AKC_MAX_EXTRACTED_CHARS_PER_PAGE: "2000000"
  AKC_MAX_EXTRACTED_CHARS_TOTAL: "20000000"
  AKC_PRIVATE_MODE: "true"
  AKC_DEFAULT_RETENTION_DAYS: "7"
  AKC_FREE_DAILY_FILE_CAP: "5"
  AKC_FREE_DAILY_PAGE_CAP: "50"
  AKC_FREE_DAILY_GPU_COST_USD_CAP: "1.000000"
  AKC_ANALYSIS_POLL_INTERVAL_SECONDS: "0.5"
  AKC_ANALYSIS_MAX_ATTEMPTS: "3"
  AKC_ANALYSIS_LEASE_SECONDS: "330"
  AKC_ANALYSIS_ATTEMPT_TIMEOUT_SECONDS: "300"
  AKC_ANALYSIS_BACKOFF_BASE_SECONDS: "2"
  AKC_ANALYSIS_BACKOFF_MAX_SECONDS: "120"
  AKC_ANALYSIS_BACKOFF_JITTER_RATIO: "0.2"
  AKC_ANALYSIS_SANDBOX_LAUNCHER: bubblewrap
  AKC_ANALYSIS_CHILD_MEMORY_BYTES: "1610612736"
  AKC_ANALYSIS_CHILD_FILE_BYTES: "536870912"
  AKC_ANALYSIS_CHILD_OPEN_FILES: "128"
  AKC_ANALYSIS_MAX_RESULT_BYTES: "134217728"
  AKC_PREVIEW_ENABLED: "true"
  AKC_PREVIEW_DPI: "110"
  AKC_PREVIEW_MAX_LONG_EDGE: "1800"
  AKC_PREVIEW_THUMBNAIL_LONG_EDGE: "360"
  AKC_PREVIEW_MAX_PIXELS: "20000000"
  AKC_PREVIEW_MAX_BYTES_PER_ASSET: "8388608"
  AKC_PREVIEW_MAX_TOTAL_BYTES: "268435456"
  AKC_METRICS_ENABLED: "true"
  AKC_METRICS_BIND_HOST: 0.0.0.0
  AKC_METRICS_PORT: "9102"
