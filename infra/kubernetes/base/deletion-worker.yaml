apiVersion: v1
kind: ServiceAccount
metadata:
  name: akc-deletion-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akc-deletion-worker
  labels:
    app.kubernetes.io/name: akc-deletion-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: akc-deletion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akc-deletion-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: akc-deletion-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 270
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: akc-deletion-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: akc-deletion-worker
      containers:
        - name: deletion-worker
          # An environment overlay MUST replace this with a signed immutable digest.
          image: registry.invalid/akc-scheduler:replace-with-signed-digest
          imagePullPolicy: IfNotPresent
          command: [python, -m, akc_scheduler, --mode, deletion]
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: akc-deletion-runtime
            - secretRef:
                name: akc-deletion-secrets
                optional: false
          startupProbe:
            exec:
              command: [python, -m, akc_scheduler, --check, --mode, deletion]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [python, -m, akc_scheduler, --check, --mode, deletion]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [python, -c, "import os; os.kill(1, 0)"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: akc-deletion-metrics
  labels:
    app.kubernetes.io/name: akc-deletion-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: akc-deletion-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: akc-deletion-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: akc-deletion-worker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-to-deletion-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: akc-deletion-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9100
