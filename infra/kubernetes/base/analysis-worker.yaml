apiVersion: v1
kind: ServiceAccount
metadata:
  name: akc-analysis-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akc-analysis-worker
  labels:
    app.kubernetes.io/name: akc-analysis-worker
    app.kubernetes.io/component: untrusted-document-worker
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: akc-analysis-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akc-analysis-worker
        app.kubernetes.io/component: untrusted-document-worker
    spec:
      serviceAccountName: akc-analysis-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The production cluster must provide this user-space kernel RuntimeClass.
      runtimeClassName: gvisor
      terminationGracePeriodSeconds: 340
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: akc-analysis-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: akc-analysis-worker
      containers:
        - name: analysis-worker
          # An environment overlay MUST replace this with a signed immutable digest.
          image: registry.invalid/akc-analysis-worker:replace-with-signed-digest
          imagePullPolicy: IfNotPresent
          command: [python, -m, akc_worker_document]
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: akc-analysis-runtime
            - secretRef:
                name: akc-analysis-secrets
                optional: false
          startupProbe:
            exec:
              command: [python, -m, akc_worker_document, --check]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [python, -m, akc_worker_document, --check]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [python, -c, "import os; os.kill(1, 0)"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            procMount: Default
            capabilities:
              drop: [ALL]
            appArmorProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: sandbox-tmp
              mountPath: /tmp
      volumes:
        - name: sandbox-tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: akc-analysis-metrics
  labels:
    app.kubernetes.io/name: akc-analysis-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: akc-analysis-worker
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: akc-analysis-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: akc-analysis-worker
