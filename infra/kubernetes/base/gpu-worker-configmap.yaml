apiVersion: v1
kind: ConfigMap
metadata:
  name: akc-gpu-worker-runtime
data:
  AKC_ENV: production
  AKC_LOG_LEVEL: INFO
  AKC_METRICS_ENABLED: "true"
  AKC_METRICS_BIND_HOST: 0.0.0.0
  AKC_METRICS_PORT: "9104"
  AKC_GPU_WORKER_ENABLED: "true"
  AKC_GPU_DATABASE_ROLE: akc_gpu_worker
  AKC_SCHEDULER_POLL_INTERVAL_SECONDS: "0.5"
  AKC_SCHEDULER_BATCH_SIZE: "25"
  AKC_GPU_PRESIGN_TTL_SECONDS: "1200"
  AKC_GPU_LEASE_SECONDS: "60"
  AKC_GPU_PROVIDER_CALL_TIMEOUT_SECONDS: "30"
  AKC_GPU_PROVIDER_JOB_TIMEOUT_SECONDS: "900"
  AKC_GPU_POLL_INTERVAL_SECONDS: "2"
  AKC_GPU_BACKOFF_BASE_SECONDS: "2"
  AKC_GPU_BACKOFF_MAX_SECONDS: "120"
  AKC_GPU_BACKOFF_JITTER_RATIO: "0.2"
  AKC_GPU_MAX_CANCEL_ATTEMPTS: "8"
  AKC_GPU_MAX_OUTPUT_BYTES: "12582912"
  # Replace both placeholders with the exact hosts emitted in presigned URLs.
  # Wildcards, ports, paths, and schemes are rejected at startup.
  AKC_GPU_ALLOWED_INPUT_HOSTS: replace-with-presigned-source-host
  AKC_GPU_ALLOWED_OUTPUT_HOSTS: replace-with-presigned-derived-host
  AKC_OBJECT_STORE_DRIVER: s3
  AKC_S3_USE_AMBIENT_CREDENTIALS: "true"
  # This endpoint must be public/provider-reachable HTTPS; never use a
  # cluster-only Service address for grants consumed by a serverless worker.
  AKC_S3_ENDPOINT_URL: https://replace-with-provider-reachable-object-store-host
  AKC_S3_REGION: ap-northeast-2
  AKC_S3_BUCKET_QUARANTINE: replace-with-quarantine-bucket
  AKC_S3_BUCKET_SOURCE: replace-with-source-bucket
  AKC_S3_BUCKET_WORKING: replace-with-working-bucket
  AKC_S3_BUCKET_DERIVED: replace-with-derived-bucket
  AKC_S3_BUCKET_EXPORTS: replace-with-exports-bucket
  AKC_S3_BUCKET_AUDIT: replace-with-audit-bucket
