apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatch-worker-durable-knowledge-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: akc-dispatch-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: akc-infrastructure
          podSelector:
            matchLabels:
              app.kubernetes.io/name: akc-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: "::/0"
            except:
              - "::/128"
              - "::1/128"
              - "fc00::/7"
              - "fe80::/10"
              - "ff00::/8"
              - "2001:db8::/32"
      ports:
        - protocol: TCP
          port: 443
---
