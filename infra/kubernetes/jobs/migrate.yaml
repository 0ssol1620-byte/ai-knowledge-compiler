apiVersion: batch/v1
kind: Job
metadata:
  name: akc-migrate-replace-with-release-revision
  namespace: akc
  labels:
    app.kubernetes.io/name: akc-migrate
    app.kubernetes.io/part-of: ai-knowledge-compiler
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akc-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.invalid/akc-api:replace-with-signed-digest
          command: [python, -m, alembic]
          args: [upgrade, head]
          env:
            - name: HOME
              value: /tmp
            - name: AKC_ENV
              value: production
            - name: AKC_LOCAL_BACKGROUND_TASKS
              value: "false"
          envFrom:
            - configMapRef:
                name: akc-runtime
            - secretRef:
                name: akc-migration-secrets
                optional: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
