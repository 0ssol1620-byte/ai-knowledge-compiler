          2026-10-20 (history step 24); a build step bakes a fingerprint with the
          sha256 of every weights file to /opt/models/.hf-ocr-manifest.json. The
          revision of those files is not stated in any document read, and at
          start the wrapper checks Hugging Face, then ModelScope, for newer
          weights and replaces them unless HF_WEIGHT_SYNC=0. The pinned weights
