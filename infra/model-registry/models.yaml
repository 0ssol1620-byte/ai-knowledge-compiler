      version: null
      image_digest: null
      # WO-D10-0H, from config.json at the pin and vLLM's documentation only.
      # Out of the smoke under decision A0-6.
      serving:
        runner: teleocr
        verdict: cannot_be_served_under_the_licence_constraint
        a0_exception: >-
          vLLM 0.22.1, Resolved architecture Qwen2_5_VLForConditionalGeneration;
          building Qwen2Attention -> get_rope -> MRotaryEmbedding:
          "assert sum(self.mrope_section) == rotary_dim // 2" AssertionError
          (vllm/model_executor/layers/rotary_embedding/mrope.py line 251).
        why: >-
          config.json: text hidden_size 1024, num_attention_heads 16,
          num_key_value_heads 8, head_dim 128, rope_scaling.mrope_section
          [16, 24, 24] (sum 64). The assertion holds for rotary_dim 128
          (= head_dim) and fails for 64 (= hidden_size / num_attention_heads),
          so the layer was built with a head size derived from hidden_size, not
          the declared head_dim (inferred from the arithmetic; vLLM's source was
          not read). The card says the model is built on Qwen2.5-VL and Qwen3,
          and config.json maps every Auto class to the repository's own
          modeling_naviocr.py: the stock Qwen2.5-VL decoder does not describe
          this checkpoint.
        options_considered: >-
          (1) --hf-overrides on num_attention_heads or hidden_size: changes the
