    superseded_by: research/experiments/H1-E-IDENTITY-SCALABILITY-01/receipts/shadow-equivalence-rerun-pinned-2026-08-19.json
    claim_carrying: false

  - path: research/experiments/H1-E-IDENTITY-SCALABILITY-01/receipts/scaling-2026-08-19.json
