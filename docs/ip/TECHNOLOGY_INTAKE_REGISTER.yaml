# ---------------------------------------------------------------------------
# Arena intake (WO-D10-0A, 2026-11-17). Models, tools, a dataset and hosted
# APIs read for the D10 screen. EVALUATION ONLY: no row admits production use,
# and every registry row an entry names carries zero traffic.
#
# Snapshots: public licence texts, model cards and terms pages, fetched on
# 2026-11-17 with User-Agent "TAVONEL-research/1.0 (https://tavonel.com/contact)".
# No weights, no clone, no install, no account, no key, no call. The bytes are
# kept OUTSIDE this repository, as the dataset rows above keep theirs:
# D:/CodexProjects/v34-lanes/receipts/WO-D10-0A/licence-snapshots/<sha256>.<ext>,
# index terms.json beside them, every digest recomputed by verify_snapshots.py
# (output kept as verify_snapshots.out.txt). docs/ip/licence-snapshots/ was the
# intended home; docs/ip/ is privileged-by-default (docs/ip/.gitignore and
# scripts/ip_privilege_guard.py) and admitting a subdirectory is a guard change,
# so it is proposed separately rather than made here.
#
# The four licence axes are judged separately (code, weights, dataset terms,
# hosted terms); clearing one clears none of the others. A licence is copyright
# permission from its contributor, not patent freedom to operate. A capability
# (vision, Korean, a format) is quoted with its source class (VENDOR =
# the model's own maker, MAINTAINER = a benchmark's maintainer, THIRD-PARTY) or
# marked UNVERIFIED; none is inferred from a name. No public score below is a
# result of ours.
#
# Axis verdicts: cleared_evaluation_only | review_required | not_applicable | blocked.
# deciding_axis names the licence the row's use rests on and follows from the
# row's kind (model: weights, hosted: hosted, dataset: dataset, tool: code); a
# row is EVALUATION_ONLY only when that axis is cleared_evaluation_only and the
# row is not RED, and any other status says why in held_reason. Every cleared
# axis rests on a captured snapshot of that axis (the main snapshot for the
# deciding axis); every blocked axis names the repository it blocks.
# ---------------------------------------------------------------------------
arena_intake:
  - id: model_mineru_pipeline
    kind: model
    arena_slot: C0
    reference: "MinerU pipeline weights opendatalab/PDF-Extract-Kit-1.0 (incumbent control; production image digest, MinerU 3.4.4)"
    publisher: "OpenDataLab (MinerU Team)"
    upstream_id: opendatalab/PDF-Extract-Kit-1.0
    upstream_revision: "ed6b654c018d742e65a17671e379c5e6ecc87ec9"
    registry_provider_key: mineru
    classification: ORANGE
    status: EVALUATION_ONLY
    deciding_axis: weights
    use: "A2a/A2b incumbent control only."
    snapshot_url: "https://huggingface.co/opendatalab/PDF-Extract-Kit-1.0/raw/ed6b654c018d742e65a17671e379c5e6ecc87ec9/README.md"
    snapshot_sha256: "96da5ddde73c3f578b9eab235ac59cbb5f512755090779a14461863767b70f34"
    fetched_at: "2026-11-17T04:51:44.993176+00:00"
    other_snapshots:
