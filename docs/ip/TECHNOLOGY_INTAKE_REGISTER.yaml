      that privacy statement says nothing about who holds rights in them.
      Filings and our renderings of them are therefore treated as not
      redistributable, and no record calls them public domain.
    not_cleared: "Publishing any page, excerpt, image or text of a filing; 'public domain' as a legal claim about filer content."

