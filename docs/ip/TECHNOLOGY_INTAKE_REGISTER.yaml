# TAVONEL — Technology Intake Register
#
# The binding half of docs/north-star/TAVONEL_FTO_ABSORPTION_BLUEPRINT_v1.0.md
# (sha256 ba286c2216805077e5a9c39546b7fee191d8e3670d6f3b8363d18010e044e94b),
# §1.4, §2 and §15.
#
# WHY THIS FILE EXISTS SEPARATELY FROM THE BLUEPRINT
#   The blueprint is 2,395 lines and mostly proposes future work. The rules
#   below bind *now*, on work already in flight, and a rule nobody can find is
#   not a rule. This file is the checkable form.
#
# PRECEDENCE (blueprint §0.4) — LEGAL-HOLD, DO NOT COPY and DESIGN-AROUND
# outrank everything, including the v5 protected core and repository evidence.
#
# THE PRINCIPLE THAT IS EASIEST TO GET WRONG (§2.1)
#   An OSS licence is not patent freedom to operate. A permissive licence grants
#   copyright permission from that contributor; it settles nothing about a third
#   party's patents. And a public GitHub repository with no LICENSE grants no
#   commercial reuse right at all — readable is not reusable.

