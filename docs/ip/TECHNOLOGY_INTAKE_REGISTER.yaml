# ---------------------------------------------------------------------------
# What binds the tracks currently in flight
# ---------------------------------------------------------------------------
binding_now:
  - track: "IP & Research"
    rules:
      - "Family A must not read onto IBM US11605028B2's sequential-inference shape."
      - "Family B must not claim generic versioned rebuild, propagated deletion, or temporal lineage — all three are RED."
      - "Any baseline reproduced from a YELLOW paper is clean-room: requirement-level summary only, no source snippets passed to the implementer (§15.3)."
      - "Record which sources each agent read. §15.3 step 5 requires the provenance trail, not just the outcome."
    convergence: >-
      The IP track reached the same narrowing independently, before this
      blueprint was absorbed — it recommended not claiming parser routing,
      cost-aware routing, multi-engine ensembling, dependency-graph selective
      rebuild, cross-version alignment, or atomicity. Two independent routes to
      the same answer is the strongest signal available here.

  - track: "Security"
    rules:
      - "Nothing in the blueprint's RED or YELLOW list touches the dual-plane authorization work."
      - "Cedar / OpenFGA / OPA are P3 and explicitly gated on measured need. Do not adopt a policy engine."

  - track: "Cinematic"
    rules:
      - "No external visual dependency enters without a GREEN classification and an SBOM entry."
      - "Marketing language must align with the design-around (§15.4 step 7): do not describe selective recompilation or lineage in terms that read onto a RED family."

