    axes:
      code:
        verdict: cleared_evaluation_only
        basis: >-
          MinerU Open Source License (LICENSE.md, 3,301 B, identical at the
          3.4.4 and 4.2.3 release tags): Apache-2.0 plus three added terms -- a
          separate commercial licence above 100 million MAU or USD 20 million
          monthly revenue (consolidated with affiliates), an obligation to state
          prominently that MinerU is used when offering an online service on it,
          and automatic termination if either is not met.
      weights:
        verdict: cleared_evaluation_only
        basis: >-
          The weights repository has no LICENSE file. Its model card (835 B) has
          no front matter: a `license: agpl-3.0` block appears as card body text
          after the download instructions, so it is not parsed as metadata (the
          API revision JSON at the pin has cardData null and no license tag),
          and the card carries no licence text. Sub-model cards
          for UniMERNet variants and StructEqTable say apache-2.0. The
          subdirectories MinerU 3.4.4 loads (mineru/utils/enum_class.py ModelPath
          at the tag) are PP-DocLayoutV2, unimernet_hf_small_2503,
          pp_formulanet_plus_m, paddleocr_torch, SlanetPlus, UnetStructure and
