# ---------------------------------------------------------------------------
# Datasets read for EVALUATION ONLY (SCOPE-FOUNDER-20261116, Amendments 3-4).
# Dataset terms only: code, model-weight, dataset and hosted-API terms are four
# separate licences, and these rows clear none of the others. Local copies belong
# to another project; they are pinned by absolute path + sha256 in
# D:/CodexProjects/v34-lanes/corpus/lpc-sources.v1.json. The other project's hash
# list is a COLLECTOR MANIFEST: it proves the bytes are unchanged since collection,
# not their provenance. Nothing is copied into this repository. Common limits:
# internal benchmark use; no redistribution of documents, pages, rows or
# renderings; a published number is an aggregate score bound to a receipt; no
# trading, investment-advice or government-endorsement claim.
# Every `basis` below was read from the snapshot bytes its row names by sha256
# (run WO-LPC-R0: D:/CodexProjects/v34-lanes/corpus/licences/terms.json, bytes in
# <sha256>.html beside it) for WO-LPC-0 on 2026-11-17, not from the live site.
# A row whose terms the snapshot does not settle is HELD, and says why.
# ---------------------------------------------------------------------------
datasets_evaluation_only:
  - id: data_sec_fsds
    reference: "SEC Financial Statement Data Sets, quarterly ZIPs 2009q1-2026q1"
    publisher: "U.S. Securities and Exchange Commission (DERA)"
    classification: ORANGE
    status: EVALUATION_ONLY
    use: "Gold values for screen critical fields; revision pairs; point-in-time tasks."
    snapshot_url: "https://www.sec.gov/about/privacy-information#copyright"
    snapshot_sha256: "8947260f51dc2be0fd82832cc6b4b31dac9e55cf31c2f92e7060895037045a3d"
    fetched_at: "2026-11-16T19:59:45.522493+00:00"
    basis: >-
      Page "SEC Web Site Privacy and Security Policy", section "Website
      Dissemination" (element id `dissemination`; page last reviewed Nov. 29,
      2023). Its first sentence says information presented on sec.gov is
      "considered public information and may be copied or further distributed"
      by site users without the SEC's permission. The same section asks users to
      consider citing the SEC as the source and not to use the SEC seal, logos or
      artwork; says SEC, EDGAR, the EDGAR logo and the EDGARLink names are SEC
      registered trademarks that need an SEC licence for use in the trade name,
      trademark or domain name of an SEC- or EDGAR-related business; and allows mentioning EDGAR in text
      without a licence as long as no SEC affiliation or approval is implied. The
      word copyright does not occur on the page, and the URL fragment `#copyright`
      matches no element in the snapshot. The page does not name the Financial
      Statement Data Sets or any other data set, so this row rests on the general
      sec.gov statement; the common limits above (no redistribution) apply
      regardless.
    not_cleared: "Redistribution of the ZIPs or rows; any claim that values are SEC-verified."

  - id: data_sec_edgar_filings
    reference: "EDGAR primary documents (10-K, 10-Q, 10-K/A, 20-F, 10-KT), 23,482 filings 2017-2026, and bulk submissions.zip of 2026-08-16"
    publisher: "Authored by each registrant; disseminated by the SEC through EDGAR"
    classification: ORANGE
    status: EVALUATION_ONLY
    rights_class: public_record   # published by a regulator, authored by a third party, redistribution not assumed
    use: "Renderings parsed by benchmark candidates (filer-page excerpts printed locally); acceptance-time witness."
    snapshot_url: "https://www.sec.gov/about/privacy-information#copyright"
    snapshot_sha256: "8947260f51dc2be0fd82832cc6b4b31dac9e55cf31c2f92e7060895037045a3d"
    fetched_at: "2026-11-16T19:59:45.522493+00:00"
    basis: >-
      The page is silent on registrant-authored content. Deciding text: the first
      sentence of section "Website Dissemination" (element id `dissemination`),
      which lets site users copy and redistribute information on sec.gov
      "without the SEC’s permission". The permission it gives is the SEC's own.
      Nothing in that section, or elsewhere on the page, mentions registrants,
      the authors of filings, third-party content or copyright. Outside the site
      menu, filings appear once, in section "Information Collected and Stored
      Automatically", as an example of information visitors read or download;
      that privacy statement says nothing about who holds rights in them.
      Filings and our renderings of them are therefore treated as not
      redistributable, and no record calls them public domain.
    not_cleared: "Publishing any page, excerpt, image or text of a filing; 'public domain' as a legal claim about filer content."

  - id: data_alfred_vintages
    reference: "FRED/ALFRED vintage observations, local CSV sha256 f01bc6cff96e4582fbac059c08dee7dc93fe9a81ce3463f2187c1a41fa8e8d40 (a derived CSV of another project; API responses not retained)"
    publisher: "Federal Reserve Bank of St. Louis (FRED/ALFRED); series owned by their original sources"
    classification: ORANGE
    status: DENIED
    denied_on: "2026-11-17"
    denied_reason: >-
      The FRED legal terms prohibit this use. Snapshot "https://fred.stlouisfed.org/legal/"
      (WO-D21-5 receipt fetch_log.jsonl, sha256 7d032ef70fb1e934f5ca76dc69e0ba941f09620078c7d138d4c39dc664abc8b4),
      API prohibitions: (k) "Use the FRED® API to access the FRED® Services or FRED® Content in
      connection with the development or training of any software program or system or machine learning,
      including, but not limited to, large language models, deep learning, generative artificial
      intelligence, or any other program or process commonly known as artificial intelligence."
      (l) "Use the FRED® API in connection with storing, caching, or archiving any portion of the FRED®
      Services or FRED® Content; providing any stored, cached, or archived portion of the FRED®
      Services or FRED® Content to any third party; or incorporating any FRED® Content in any
      database, compilation, archive, cache, or other medium." The same page's general prohibition
      repeats (k)'s text for the FRED® Services and FRED® Content without the API qualifier.
    decision: >-
      D21-L1 (WO-D21-6): FRED/ALFRED content is not used by this program. Every ALFRED action is deny
      in the rights register, no FRED or ALFRED request is made, and the local vintage CSV is not read
      for any purpose. Point-in-time ground truth is the EDGAR acceptance timestamp only. Written
      permission from the Bank would be a new intake row, a founder matter. Nothing was fetched and
      nothing is in a build, so there is nothing to roll back.
    held_for: "Nothing; the rows below record what was read before the denial and are kept as history."
    snapshot_url: "https://fred.stlouisfed.org/docs/api/terms_of_use.html"
    snapshot_sha256: "1b363c108142640f7e3a450169808cf195117fa3d7771651ae52bea5e515935c"
    fetched_at: "2026-11-16T19:59:46.070812+00:00"
    basis: >-
      Page "FRED® API Terms of Use". Section "Property Rights": series offered
      through the API may belong to third parties and carry copyright
      restrictions that the API does not override; using a third-party series
      for more than personal use needs the owner's permission, which the St.
      Louis Fed says it cannot give; and "Copyrighted series contain the word
      'Copyright' in their notes." The same section extends the St. Louis Fed's
      rights to all output of the API. Section "Prohibitions" bars implying St.
      Louis Fed endorsement and removing proprietary notices attached to data
      obtained through the API; section "Requirements" obliges an application
      that uses the API to display a non-endorsement notice. The terms also
      incorporate the St. Louis Fed web site Legal Terms and Privacy Policy;
      neither is among the R0 snapshots, and neither was read.
    series_allowed:   # one snapshot per series page; ownership read from the page, not assumed
