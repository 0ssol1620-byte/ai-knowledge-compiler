    series_pages_basis: >-
      Read the same way on all six pages. The Notes panel names as Source the
      body listed per series above (U.S. Bureau of Labor Statistics, or Board of
      Governors of the Federal Reserve System); none names a third-party owner.
      The series notes do not contain the word Copyright, which the API terms
      give as the mark of a copyrighted series. Each page's Suggested Citation
      credits that source and names FRED at the St. Louis Fed as where the data
      was retrieved, with the series URL. Each page also carries a copyright
      banner for shared graphs inside markup of class `hide` (hidden in the page as
      served), and head metadata (keywords and a JSON-LD
      licence link to fred.stlouisfed.org/legal/#copyright-public-domain) that
      labels the series public domain with citation requested. That legal page
      was not snapshotted, so this register does not itself call the series
      public domain. No series moves to series_excluded.
    series_excluded:   # no R0 snapshot was taken for these; the reasons come from the founder's scope (SCOPE-FOUNDER-20261116), not from a page reading
      - { series: BAMLH0A0HYM2, reason: "third-party owned (ICE Data Indices)" }
      - { series: VIXCLS,       reason: "third-party owned (Cboe)" }
      - { series: DTWEXBGS,     reason: "terms not read" }
    verify_at_merge_separately:
      - question: "Reuse of data retrieved under ANOTHER project's FRED API key: do the terms bind the key holder only, or the data?"
        state: MOOT_DENIED
        finding: >-
          Superseded by the denial above (clauses (k) and (l) bind regardless of whose key retrieved the data). Earlier reading: not settled by the R0 snapshot. The opening paragraph binds whoever uses
          the API. Section "API Key" issues each key to one registrant and makes
          that registrant alone answerable to the St. Louis Fed for its use of
          the API. Section "Property Rights" extends the St. Louis Fed's rights
          to all API output. Section "Term and Termination" requires destroying
          copies of the API when the licence ends and says nothing about
          retrieved data. No section addresses stored or derived data, or a
          party that holds API output without having used the API. The
          incorporated Legal Terms were not snapshotted, so whether they address
          it is unknown.
