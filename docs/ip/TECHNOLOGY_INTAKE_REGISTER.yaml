    classification: ORANGE   # the work order proposed GREEN_PENDING_VERIFY; `classifications` above is a closed vocabulary, so ORANGE with this note
    status: LOCAL_TOOL_NOT_SHIPPED
    snapshot_file: "LICENSE.headless_shell sha256 273fdb2b9a87aecb3e7a719c42ce6d045459dc6efb398d3baaaedc18f4a3c21f"
    snapshot_file_location: "%LOCALAPPDATA%/ms-playwright/chromium_headless_shell-1228/chrome-headless-shell-win64/LICENSE.headless_shell (2,037,413 bytes); its sha256 and the exe sha256 were re-computed on 2026-11-17 and equal the values in this row"
    basis: >-
      The file concatenates 274 notice sections, each headed by a component
      name. The first, "The Chromium Project", is a three-condition BSD-style
      licence ("Copyright 2015 The Chromium Authors"): source and binary
