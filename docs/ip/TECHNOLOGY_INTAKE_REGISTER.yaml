          and are checked against sha256 constants (src/ocr/models.ts,
          src/pdf/formula/models.ts). Default OCR path: PP-OCRv5 mobile det +
          korean_PP-OCRv5 mobile rec + dict (PaddlePaddle ONNX repositories,
          card metadata apache-2.0, no LICENSE files). Optional: PP-OCRv5 server
