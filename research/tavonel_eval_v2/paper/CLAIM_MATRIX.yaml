    was not scorable, and SFIR1 through SFIR3 each terminated before payload, so no successor
    cohort or GPU authority exists
  consequence: no claim about model behaviour of any kind is available
- id: G-03
  gap: the oracle shares the specification it audits
  consequence: a specification-level defect is invisible. The permitted wording is "independent
    implementation", never "independent verification".
- id: G-04
  gap: no calibration corpus exists for any threshold
  consequence: every threshold in the system is uncalibrated and must be presented as a declared
    parameter, never as a measured one
- id: G-05
  gap: no external reviewer has read any of it
  consequence: self-approval is not approval; the founder gate is unchanged
- id: G-06
  gap: the independent-replication sequence produced three instrument-feasibility refusals and
    no endpoint observation; SFIR4 was deliberately not opened after those observed failure modes
  consequence: the manuscript can report C-35 as a negative methodological result but cannot
    convert it into a compiler verdict or treat another post hoc instrument as confirmatory
