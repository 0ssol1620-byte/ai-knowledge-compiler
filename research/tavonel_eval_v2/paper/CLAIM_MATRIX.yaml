  - the method cannot find value changes
  limitations:
  - the bounds are declared and were not tuned to the yield; a longer horizon or a deeper
    revision window would find more, and moving either after seeing this number is what the
    protocol forbids
- id: C-15
  wording: Three preregistered CPU preflights, each frozen before its cohort existed, refused
    to start a GPU experiment; the programme spent 0 GPU seconds and $0 of an approved $40.
  protocol: STOP-V2-005
  receipt: receipts/route-a-closure--20260823T014801Z-660bb0cfcc24.json
  split: held_out
  status: PROVEN_ON_HELD_OUT_DATA
  allowed:
