- id: C-16
  wording: Across 310 held-out revision pairs from four source families, every one of 373,006
    changed source regions resolved to exactly one declared state and none was left unclassified.
    Of 121,682 regions the grammar classified MODELED, 63,196 could not be carried by the
    compiled state at all. In 30 pairs a region the compiled state could not carry lay inside
    a scope the run declared locally complete, and in 60 pairs the compiled state did not
    move at all while the raw source had.
  protocol: SOURCE_FAITHFULNESS_HELDOUT_V1
  receipt: receipts/sfh1-source-faithfulness--20260823T031017Z-329258f9ec8a.json
  split: development_diagnostic
  split_was: held_out
  split_changed_by: founder ruling 2026-08-23, evidence-hygiene pass
  split_changed_because: a smoke receipt carrying outcome-derived metrics predates the protocol
    amendment by 35 minutes, and the protocol was first frozen after the run it governs had
    already started. The one-sided test cannot be satisfied. See INC-V2-027.
  status: MEASURED_AS_A_DEVELOPMENT_DIAGNOSTIC
  verdict: FAIL
  allowed:
  - every changed source region received a declared state; none fell through
  - a majority of the regions the grammar calls MODELED have nowhere to live in the compiled
    state
  - on this held-out cohort the system loses source facts and, in 30 of 310 pairs, does not
    say so
  - the gate had power - 601 of 1,010 scopes were declared locally complete, so a passing
    result would have meant something
  forbidden:
  - the compiler is unfaithful in general
  - 52% of source facts are lost
  - 209 silent drops
  limitations:
  - the scope-level figure of 209 is an upper bound. Markdown scope regions are a minimum-to-maximum
    interval over located witness elements, which is a superset of the scope. See INC-V2-026.
  - an attribution-free criterion - the compiled state did not move at all while some scope
    was declared complete - gives 34 pairs, larger than the gate's 30, so the verdict is not
    an artefact of that coarseness
  - 44 revisions exceeded the declared 2 MB payload bound and are reported under PAYLOAD_TOO_LARGE_TO_CLASSIFY
    rather than scored
  - smoke runs on 8 lineages preceded the freeze. See INC-V2-025.
- id: C-17
  wording: Against an expected state rebuilt from raw bytes in a separate isolated process,
    judged by a third comparator that imports neither side, 114 of 164 judged pairs were exactly
    equivalent, 50 diverged, and 4 carried an oracle-relative divergence in which the engine
    had carried forward an artifact the independent implementation said must change. In 12
    pairs whose only modelled change was a reference target, the engine reported no change
    of any kind.
  protocol: ORACLE_INDEPENDENCE_V2
  study_name: independent implementation differential study
  name_was: independent oracle verification
  name_changed_because: the two implementations share a specification, so independent VERIFICATION
    was not achieved and the earlier name overstated the result.
  receipt: receipts/oracle-independence-v2--20260823T033320Z-248859f8c1ee.json
  split: development_diagnostic
  split_was: held_out
  split_changed_by: founder ruling 2026-08-23, evidence-hygiene pass
  split_changed_because: a smoke receipt carrying outcome-derived metrics predates the protocol
    amendment by 28 minutes. The study fails the identical test SFH1 failed, on identical
    evidence. See INC-V2-027.
  status: MEASURED_AS_A_DEVELOPMENT_DIAGNOSTIC
  verdict: FAIL
  allowed:
  - an independent implementation that starts at raw bytes surfaced divergences that one starting
    at the canonical document could not
  - the four divergences are oracle-relative until confirmed against the production path,
    and C-18 is that confirmation
  - two independent implementations of the same written canonicalisation specification disagree
    on unit derivation in 30.5% of pairs
  - typed invalidation was consistent on every pair where it could be tested (77 of 77)
  - a pair the oracle could not judge was reported UNJUDGED and never counted as a pass (6
    of 170)
  forbidden:
  - the selective compiler is incorrect
  - independent verification
  - describing any earlier equivalence result as independent-oracle verified
  limitations:
  - independence is of the IMPLEMENTATION, not of the SPECIFICATION. The oracle implements
    rules written down by reading the engine, so a defect in the rules remains common-mode.
  - the four divergences are reported as ORACLE_RELATIVE and are not strengthened from this
    result. Their production status is C-18.
  - the word independent applies to the implementation only. True independent verification
    would need an independently checkable reference semantics for the supported grammar, which
    does not exist.
  - the 30.5% divergence is a finding about the specification, not a defect rate of the selective
    path
  - sec_edgar contributed zero judged pairs and is reported as zero
- id: C-18
  wording: 'Four named cases flagged by the differential study were re-examined against the
    production path alone - a clean full rebuild of freshly fetched bytes versus the production
    selective execution on the same bytes. All four confirm: an artifact the clean rebuild
    moved was carried forward by the selective execution. In three of them the selective path
    detected no change of any kind.'
  protocol: forensic confirmation under the founder ruling of 2026-08-23
  receipt: receipts/forensic-stale-escape--20260823T040142Z-0c6f0f65db2e.json
  split: development_diagnostic
  status: FORENSICALLY_CONFIRMED_ON_FOUR_NAMED_CASES
  allowed:
  - four confirmed selective stale escapes, named individually
  - the production selective state is not reproducible by a clean full rebuild in these four
    cases
  - the independent implementation said where to look; the production path answered
  forbidden:
  - a stale escape rate
  - 4 of 164
  - the selective compiler is broken
  - any use of these four cases to rescore the differential study
  limitations:
  - four named cases are not a denominator. This is post-result forensic confirmation, not
    a rate estimate.
  - it re-scores nothing. The differential study receipt is untouched.
  - the root cause is an alignment failure, not a lost edit. See C-19.
- id: C-19
  wording: Classified against a fixed normalisation ladder, none of the four confirmed stale
    artifacts arose from a substantive content change. One was typographic punctuation, two
    were punctuation-only, and one was a topic bucket whose membership moved.
  protocol: forensic confirmation under the founder ruling of 2026-08-23
  receipt: receipts/forensic-stale-escape-root-cause--20260823T040418Z-c4160cdad636.json
  split: development_diagnostic
  status: FORENSICALLY_CONFIRMED_ON_FOUR_NAMED_CASES
  allowed:
  - the semantic diff and the artifact fingerprint are two different functions and nothing
    requires them to agree
  - in these cases the diff correctly judged an edit non-semantic and the fingerprint moved
    anyway
  - the failure is that the selective state is not reproducible by a clean rebuild, not that
    an edit was lost
  forbidden:
  - the compiler loses edits
  - a rate of any kind
  - the canonicaliser is wrong
  limitations:
  - four named cases, classified after the fact by a ladder declared in the tool. The ladder
    order is part of the finding and is published with it.
  - no repair is applied. SOURCE_FACT_IR_V1 owns the repair and must demonstrate it on a fresh
    disjoint corpus.
- id: C-20
  wording: Two studies designed as held-out were demoted to development diagnostics because
    a smoke execution on real cohort lineages produced and exposed outcome-derived metrics
    35 and 28 minutes before their protocols were amended, and because both protocols were
    first frozen after the runs they govern had already begun.
  protocol: evidence-hygiene pass under the founder ruling of 2026-08-23
  receipt: receipts/evidence-hygiene-pass--20260823T035908Z-043914a1ec34.json
  split: development_diagnostic
  status: DEMONSTRATED_FROM_IMMUTABLE_ARTEFACTS
  allowed:
  - the demotion was derived mechanically from receipt timestamps and file modification times,
    not decided
  - a smoke run is an execution, and running one on real cohort lineages spends the held-out
    property of the study around it
  - no result was repaired, re-scored or re-run; only the split each may be reported under
    changed
  forbidden:
  - the results are invalid
  - the studies were rerun
  - held-out
  limitations:
  - the test is one-sided by construction. Absence of proof of exposure is not proof of absence
    and is not treated as such.
  - it says nothing about whether the exposure actually influenced any later decision, only
    that it cannot be ruled out
- id: C-21
  wording: SOURCE_FACT_IR_V1 implements a four-state vocabulary (REPRESENTED_IN_COMPILED_STATE,
    RECOGNIZED_BUT_UNREPRESENTED, IGNORED_BY_PREDECLARED_POLICY, UNRESOLVED_SOURCE_FACT),
    a first-class kind per semantic facet, and a four-link chain from source witness to canonical
    representation to fingerprint to dependency path, with recognition and representation
    separated and every non-declined loss fail-closed.
  protocol: SOURCE_FACT_IR_V1
  receipt: receipts/sfi1-protocol-freeze--20260823T051315Z-540eefafba09.json
  split: development
  status: IMPLEMENTED
  allowed:
  - the vocabulary, the kinds and the chain exist and are unit-tested
  - a REPRESENTED fact without a representation is refused by construction
  - an unsupported construct produces a fail-closed fact rather than silence
  - the design responds to SFH1's finding and to the four confirmed escapes
  forbidden:
  - the repair passed
  - source-faithful end-to-end
  - SFH1 was repeated and passed
  limitations:
  - a claim about what was built, not about what it achieves on held-out data
  - no fresh held-out corpus had been scored when this row was written
  - descriptive and temporal facts anchor at document scope rather than unit scope, so their
    invalidation is correct but coarse
  - the unsupported-construct table is a short named list, not a general detector. A construct
    absent from it is still silent.
  receipt_note: immutable receipt. The claim previously cited receipts/latest/, a mutable
    convenience pointer whose own note says it is NOT EVIDENCE; a pin against a file that
    can be replaced pins nothing.
- id: C-22
  wording: A fresh disjoint held-out study of SOURCE_FACT_IR_V1, frozen before its cohort
    existed and never exposed to a pre-freeze execution, was run against the seven declared
    endpoints and returned a verdict.
  protocol: SOURCE_FACT_IR_HELDOUT_V1
  receipt: receipts/sfi1-source-fact-ir--20260823T061908Z-f13fdaf22618.json
  split: held_out
  status: PROVEN_ON_HELD_OUT_DATA
  verdict: FAIL
  allowed:
  - 'the study ran on 260 fresh pairs and 128,715 source facts and returned FAIL on three
    grounds: 1,284 recognized-but-unrepresented facts, and two safety endpoints that were
    never exercised'
