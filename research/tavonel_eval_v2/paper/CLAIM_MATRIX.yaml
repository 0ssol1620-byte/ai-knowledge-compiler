- id: N-06
  finding: an outcome-independent preflight can correctly stop an expensive experiment
  evidence: C-15
- id: N-07
  finding: a declared state for every changed region is achievable, and it is not the same
    thing as carrying the region
  evidence: C-16
- id: N-08
  finding: two independent implementations of the same written canonicalisation specification
    disagree on unit derivation in nearly a third of pairs
  evidence: C-17
- id: N-09
  finding: an independent implementation that starts at raw bytes surfaces divergences one
    starting at the canonical document cannot
  evidence: C-17
- id: N-10
  finding: a semantic diff and an artifact fingerprint are two different notions of changed,
    and where they disagree the selective state stops being reproducible by a clean rebuild
  evidence: C-19
- id: N-12
  finding: carrying a source fact and being able to say where it came from are different properties.
    1,284 units hold text whose digest matches and whose source bytes cannot be located, and
    the previous vocabulary had no word for that state
  evidence: C-22
- id: N-13
  finding: splitting a status into two states can fail a study that the unsplit status would
    have passed, and the failure is the argument for the split - the old MODELED was not wrong
    about these units, it was silent about the question
  evidence: C-22
- id: N-14
  finding: an endpoint that nothing in a cohort could have violated has not been met, and
    a study whose two hardest safety endpoints went unexercised does not pass on the strength
    of the five that ran
  evidence: C-22
- id: N-11
  finding: a smoke run on real cohort lineages spends the held-out property of the study around
    it, and no later freeze restores it
  evidence: C-20
- id: N-15
  finding: exhausting a frozen acquisition frame can leave a held-out study non-scorable when
    one predeclared family quota is not met; the shortfall is reported rather than redistributed
  evidence: C-33
- id: N-16
  finding: identity equivalence and compiled-relevant change equivalence require separate
    representations; a resolver-established match can retain lineage while typed facets change
  evidence: C-34
- id: N-17
  finding: three prospectively frozen independent-replication capacity instruments can terminate
    before payload on distinct metadata constraints without producing a compiler endpoint result;
    after the third observed refusal, another redesign would risk result-following adaptation
  evidence: C-35
- id: N-18
  finding: an evidence-adequacy gate can reject the cohort that would have produced the more
    flattering headline number. A regulatory cohort whose pairs were largely byte-identical
    non-substantive reissues yielded a higher mean work-avoided figure (96.12 per cent) than
    its successor (88.66 per cent) precisely because most of its pairs had nothing to
    recompile; the preregistered minimum-changed-pair gate refused it, and the successor
    raised that threshold rather than lowering it
  evidence: C-36
- id: N-19
  finding: a fault-injection harness can fail its own gate for a reason that is not a
    defect in the system under test. PRESERVATION-E2E-01 detected 18 of 49 cross-version
    injections against a preregistered minimum of 1.0 and was recorded as a FAIL. The
    cause was that the injector always mutated the first block, while a document's
    bindings do not necessarily cite the first block. Partitioning the cases by whether
    the mutated block was cited produced a perfect diagonal of 18 detected and 0 missed
    among cited mutations, 0 detected and 31 missed among uncited ones -- which located
    the defect in the harness rather than the contract. The failing run is kept, the
    gate was left at 1.0, and the accidental behaviour was promoted to an explicit
    control (N1, 45 cases, 0 false positives) that now measures the contract's scope
    boundary instead of hiding it
  evidence: C-37
claims:
- id: C-01
  wording: On 34 revision pairs from two source families, a selective recompilation and a
    full rebuild produced identical active state, with zero artifacts carried forward whose
    full-rebuild value had moved.
  protocol: P0b_recompilation_mechanics
  receipt: receipts/p0b-mechanics.json
  split: development
  status: PROVEN_ON_DEVELOPMENT_DATA
  allowed:
  - selective recompilation agreed with full recomputation on this corpus
  - zero stale artifacts escaped on the pairs measured
  forbidden:
  - the selective compiler is correct
  - verified by an independent oracle
  limitations:
  - both sides consumed the same canonical document, so a canonicalisation defect is common-mode
    and invisible to this comparison
  - development split; two families; 34 pairs
- id: C-02
  wording: On 43 revision pairs, every artifact whose canonical inputs changed was rebuilt,
    no artifact was carried forward in violation of the declared carry ban, and three positive
    controls fired while three negative controls did not.
  protocol: P0c_coverage_completeness
  receipt: receipts/p0c-coverage-completeness--20260821T083632Z-50f5a1619262.json
  split: development
  status: PROVEN_ON_DEVELOPMENT_DATA
  allowed:
  - coverage from canonical fact to artifact held on this corpus
  forbidden:
  - coverage from source to artifact
  - nothing is dropped
  limitations:
  - measured from the canonical fact onward. The stage upstream of it is P0d, and P0d is where
    the losses are.
- id: C-03
  wording: 'Of 43 pairs that a full rebuild and a selective rebuild agreed on exactly, 26
    were simultaneously source-coverage incomplete: raw source changed in ways that reached
    no canonical fact.'
  protocol: P0d_source_coverage
  receipt: receipts/p0d-source-coverage--20260822T014018Z-fd08c210d582.json
  split: development
  status: PROVEN_ON_DEVELOPMENT_DATA
  allowed:
  - rebuild equivalence does not establish source-faithful correctness
  - equivalence and incompleteness co-occurred on 26 of 43 pairs
  forbidden:
  - the compiler is unfaithful in general
  - 60% of source is lost
  limitations:
  - the incompleteness figure is a property of this grammar on this corpus, not a rate over
    sources at large
- id: C-04
  wording: Nineteen declared refusal constructs executed as specified, every refusal carried
    its evidence, and admission was invariant across 120 permutations for each of 11 candidates.
  protocol: P3b_refusal_legibility
  receipt: receipts/p3b-refusal-legibility--20260821T083643Z-87b32c41bb7f.json
  split: development
  status: PROVEN_ON_DEVELOPMENT_DATA
  allowed:
  - the refusal machinery is order-invariant and evidence-bearing in this harness
  forbidden:
  - production-ready refusal
  - P3b proves the production implementation
  limitations:
  - a harness result. No deployed system was exercised.
- id: C-05
  wording: Using only document title, identity, type and heading fields — never atom body
