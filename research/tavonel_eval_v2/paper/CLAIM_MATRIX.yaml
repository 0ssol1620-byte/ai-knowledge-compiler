  forbidden:
  - retrieval is leakage-free
  - the router does not see the answer
  limitations:
  - development split, one cohort, one construction rule for questions
- id: C-06
  wording: The canonical unit that carries a fact and the unit a question can retrieve are
    different granularities, and the gap is measurable.
  protocol: P4d_retrieval_granularity
