forbidden_claims:
- id: F-01
  claim: general source-faithful end-to-end correctness
  why: nothing measured establishes that a fact in a source reaches a compiled artifact intact
    across arbitrary sources. P0d found 26 pairs that were rebuild-equivalent and source-coverage
    incomplete at the same time.
  phrases:
  - source-faithful end-to-end
  - end-to-end source faithfulness
  - faithfully compiles any source
  - no source fact is lost
- id: F-02
  claim: model QA improvement across all semantic revisions
  why: no model was ever run. The model experiment is NOT_RUN — PREDEFINED CPU PREFLIGHT INFEASIBLE,
    and the cohort that would have supported it was never assembled.
  phrases:
  - improves question answering
  - improves QA accuracy
  - outperforms on semantic revisions
  - model accuracy gain
- id: F-03
  claim: general forced-continuation superiority
  why: the forced-continuation arm exists as a design in a protocol that was never executed.
    A design is not a result.
  phrases:
  - forced continuation outperforms
  - forced continuation is superior
  - append-only loses to
- id: F-04
  claim: P3b demonstrates a production implementation
  why: P3b is a refusal-legibility study over 19 declared constructs on development data.
    It shows the refusal machinery behaves as specified in that harness. It says nothing about
    a deployed system.
  phrases:
  - production-ready refusal
  - P3b proves the production
  - validated in production
- id: F-05
  claim: the 28-pair Wikipedia equivalence is an independent oracle result
  why: both sides consumed the canonical document the engine had already produced. It is same-implementation
    full-recomputation equivalence, and the correction stands.
  phrases:
  - independent oracle confirmed the 28
  - 28-pair independent oracle
  - independently oracled
  - independent oracle verification
  - independently verified
  - oracle-verified
