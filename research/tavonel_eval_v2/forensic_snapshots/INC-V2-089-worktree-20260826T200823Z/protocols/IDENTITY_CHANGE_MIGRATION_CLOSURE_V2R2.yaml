# IDENTITY_CHANGE_MIGRATION_CLOSURE_V2R2 (ICMC2-R2) — the prospective closure of
# the INC-V2-037 predicate migration, run ONCE, on a NEW universe disjoint from
# every cohort any earlier closure or regression already measured, including
# V2R1's.
#
# DRAFT UNTIL ITS FREEZE RECEIPTS EXIST. This file binds nothing until
# `tools/freeze_migration_closure_v2r2.py protocol` has written an immutable
# receipt pinning this file's sha256, and the runner refuses to execute until
# every rung — acquisition frame, protocol, universe, scorer/acceptance,
# exclusions — has a receipt and every pinned digest still matches disk.
#
# WHY THERE IS AN R2. V2R1 executed exactly once and returned FAIL. The founder
# adjudicated that run INVALID_INSTRUMENT_CONTRACT, not a production failure:
# its frozen INVARIANT_6(d) equated raw revision-local logical-id equality with
# resolver-established cross-revision identity. `selective_build.snapshots`
# derives a snapshot logical id from `source_id + explicit_path`, so an incoming
# unit's id changes when its path changes, and `LogicalIdentityResolver` exists
# to bridge exactly that — on MATCHED it returns the BEFORE-side stable id while
# the incoming snapshot keeps its own. `before_ids & after_ids` is therefore not
# the set of cross-revision identity matches, and all thirty of V2R1's clause-(d)
# violations were instrument false violations produced by seventeen renamed
# correspondences.
#
# WHAT THIS FILE IS NOT.
#
#   * It is not a repair of V2R1 and it does not rescore it. That run stands,
#     its receipt is untouched, its corpus is SPENT, and its 285 lineages are
#     excluded here by name.
#   * It is not a repair of V1 either. V1 returned `overall: FAIL` permanently.
#     V1's universe is read here for ONE purpose: lineage ids, to subtract them.
#   * It is not narrower than V1 or V2R1 anywhere. The eight invariants, the
#     zero-tolerance INVARIANT_6, the >=200 pairs and the >=3 families are
#     carried forward unchanged. ONE clause moved — INVARIANT_6(d) — and it
#     moved from an identity model production does not use to the resolver
#     decision graph production actually computes, BEFORE any V2R2 material
#     existed.
#   * It does not contain a number chosen from an observed result. V2R1's
#     realised admission yield is not a basis for any quota here, and the three
#     lineages that produced its violations are DEVELOPMENT regressions that may
#     never certify this closure.
#
# V1's and V2R1's protocol files and every receipt of theirs are IMMUTABLE and
# are not opened for writing by this protocol or by any tool it names.

schema: tavonel.v2.protocol.identity_change_migration_closure.v2r2
protocol_id: IDENTITY_CHANGE_MIGRATION_CLOSURE_V2R2

# ---------------------------------------------------------------------------
