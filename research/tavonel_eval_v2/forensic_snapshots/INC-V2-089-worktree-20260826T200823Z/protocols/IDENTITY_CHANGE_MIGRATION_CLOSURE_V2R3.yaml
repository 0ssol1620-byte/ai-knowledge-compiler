# IDENTITY_CHANGE_MIGRATION_CLOSURE_V2R3 (ICMC2-R3) — the prospective closure of
# the INC-V2-037 predicate migration, run ONCE, on a NEW universe disjoint from
# every cohort any earlier closure or regression already measured, including
# V2R1's and V2R2's.
#
# DRAFT UNTIL ITS FREEZE RECEIPTS EXIST. This file binds nothing until
# `tools/freeze_migration_closure_v2r3.py protocol` has written an immutable
# receipt pinning this file's sha256, and the runner refuses to execute until
# every rung — acquisition frame, protocol, universe, scorer/acceptance,
# exclusions — has a receipt and every pinned digest still matches disk.
#
# WHY THERE IS AN R3. V2R2 executed exactly once and returned FAIL. The founder
# adjudicated that run INVALID_INSTRUMENT_CONTRACT — not a production failure,
# and not merely a rule that was a little too strict. For a unit the resolver
# called NEW while the identity-uncertainty quarantine held it, the frozen
# instrument simultaneously REQUIRED `unit_added` (clause (d), disposition B)
# and FORBADE it (clause (e), via the quarantine compatibility contract). No
# production behaviour could have satisfied both. An UNSATISFIABLE INSTRUMENT
# CONTRACT establishes nothing about the system it was pointed at.
#
# THE DEFECT IS ONE LAYER DEEPER THAN R2 THOUGHT, and it is the same family of
# error as R1's:
#
#     V2R1  read a raw snapshot id as a resolved identity
#     V2R2  read a resolver-local decision as a final identity disposition
#
# Production keeps three layers and only the third may be asserted:
#
#     1  ResolverDecisionSurface             MATCHED / NEW / AMBIGUOUS
#     2  IndependentQuarantineSurface        which ids are under uncertainty
#     3  EffectiveIdentityDispositionSurface what production may ASSERT
#
# A resolver-local NEW is NOT necessarily the final identity disposition.
# Quarantine OVERRIDES a locally definite identity assertion: it does not
# rewrite the resolver's answer historically, it changes what may be claimed
# from that answer. `effective_identity_disposition` below freezes that state
# machine BEFORE any V2R3 outcome exists, and `contract_consistency_gate`
# refuses the freeze unless an executable model checker has proved every
# reachable state carries exactly one disposition and no contradictory
# obligations.
#
# WHAT THIS FILE IS NOT.
#
#   * It is not a repair of V2R2 and it does not rescore it. That run stands,
#     its receipt is untouched, its corpus is SPENT, and its 270 lineages are
#     excluded here by name. There is no "corrected V2R2 verdict" anywhere in
#     this programme; the spent shapes are DEVELOPMENT regressions only.
#   * It is not a repair of V2R1 or of V1 either. V1 returned `overall: FAIL`
#     permanently. Their universes are read here for ONE purpose: lineage ids,
#     to subtract them.
#   * IT IS NOT A REPAIR OF PRODUCTION. An invalid instrument establishes no
#     production defect to repair. No guard was moved below NEW, no quarantine
#     was weakened, no transitive clause was removed, no identity normalisation
#     and no facet predicate was changed. `akc_cir.semantic_diff`,
#     `akc_cir.identity_quarantine` and `akc_cir.identity` are byte-identical to
#     their pre-V2R2 state and this protocol forbids changing them to make a
#     measurement pass.
#   * It is not narrower than V1, V2R1 or V2R2 anywhere. The eight invariants,
#     the zero-tolerance INVARIANT_6, the >=200 pairs and the >=3 families are
#     carried forward unchanged — this file is DERIVED from V2R2's by targeted
#     replacement rather than retyped, so seven invariants are byte-identical.
#     ONE clause moved — INVARIANT_6(d)/(e) — from two surfaces that could
#     disagree to one that cannot, BEFORE any V2R3 material existed.
#   * It does not contain a number chosen from an observed result. Neither
#     V2R1's nor V2R2's realised admission yield is a basis for any quota here,
#     and the thirteen units that produced V2R2's violations may never certify
#     this closure.
#
# THE COHORT IS NOT SELECTED FOR THE SHAPE THAT BROKE V2R2. Acquiring until a
# quarantine case appears, or over-weighting containers likely to produce one,
# would make the next result a statement about the selection. The frame forbids
# probing for it.
#
# V1's, V2R1's and V2R2's protocol files and every receipt of theirs are
# IMMUTABLE and are not opened for writing by this protocol or by any tool it
# names.

schema: tavonel.v2.protocol.identity_change_migration_closure.v2r3
protocol_id: IDENTITY_CHANGE_MIGRATION_CLOSURE_V2R3

