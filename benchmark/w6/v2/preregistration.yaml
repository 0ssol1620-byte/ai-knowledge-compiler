# W6 Benchmark v2 — PILOT PREREGISTRATION (frozen before results)
#
# This file is written and hash-frozen BEFORE any result artifact exists.
# Nothing in here is a measurement. Every threshold below is an entry gate or a
# decision rule, never a claim. Per repo discipline (see
# docs/research/PREREGISTRATION_G3_HARM_HOLDOUT.md pattern): once results land,
# this file must not be edited — deviations are recorded in the run report, not
# patched in here.

experiment_id: W6-V2-PILOT
protocol_version: 2
title: "Raw documents vs Basic RAG vs TAVONEL compiled world - protocol-valid pilot harness and small-scale run"
frozen_at: "2026-08-23T00:00:00+09:00"
git_commit_at_freeze: "9e9d69a"          # HEAD of integration/g0-consolidation the branch was cut from
worktree_branch: agent/tavonel-w6-v2
disclosure: INTERNAL_ONLY_NOT_A_CLAIM
role: PILOT - harness validation and directional signal only. No promotion, no external claim, no significance statement may cite this run.

history_context:
  v1: "INVALID (protocol flaws; do not build on it)"
  v2: "protocol adjudicated valid but NEVER RUN - this harness is its first implementation"
  v3: "6,987-title corpus freeze - see DEVIATION-01: the frozen list itself is not recoverable from this repository"
  v5: "final experiment incomplete - acquisition step died at a 900s timeout with no per-fetch timeout, retry, cache, or failure ledger"

# ---------------------------------------------------------------------------
# DEVIATIONS declared at freeze time (before any result exists)
# ---------------------------------------------------------------------------
deviations:
  - id: DEVIATION-01
    statement: >
      The v3 freeze list of 6,987 titles could not be located in the repository
      (searched: benchmark/, docs/, research/, scripts/, tools/, and all local
      linked worktrees; no dataset/title/freeze artifact with ~6,987 entries
      found). The pilot therefore freezes its own fresh 60-item source list
      below, in fixed order, BEFORE acquisition. Any future full run must first
      re-derive or re-freeze the v3 list; this pilot's list is not a substitute
      for it.
  - id: DEVIATION-02
    statement: >
      The 'TAVONEL compiled world' arm uses a pilot-grade compiler implemented
      in this harness (LLM extraction into typed elements with provenance ids),
      not the production services/api collection pipeline. It exercises the
      compile-then-retrieve shape, not the product's exact algorithms.

# ---------------------------------------------------------------------------
# Corpus / acquisition (phase 1)
# ---------------------------------------------------------------------------
source_registry:
  kind: wikipedia_rest_extracts
  rationale: "public, license-compatible for internal experimentation, deterministic per-title fetch"
  endpoints:
    - "https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&formatversion=2&titles={title}"
    - "https://en.m.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&formatversion=2&titles={title}"
  per_fetch_timeout_seconds: 30
  max_attempts_per_item: 3
  retry_backoff_seconds: [2, 4]
  phase_deadline_seconds: 1200
  cache_dir: "benchmark/results/w6-v2-pilot/cache"
  usable_document_min_chars: 2000
  blocked_threshold_usable_documents: 40
  pilot_size: 60
  failure_ledger: "every failed/deadline-exceeded item is written to acquisition-report.json with url, error class, attempts"

