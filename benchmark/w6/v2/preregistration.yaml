# ---------------------------------------------------------------------------
# Model pin (identical for question generation, compilation, answering, judging)
# ---------------------------------------------------------------------------
model:
  temperature: 0
  primary: "openai/gpt-4o-mini"
  fallback_order:
    - "google/gemini-2.0-flash-001"
    - "meta-llama/llama-3.3-70b-instruct"
  single_model_rule: "all four phases MUST run on the one model id recorded at probe time; mixing models voids the run"
  max_tokens:
    question_generation: 350
    compilation: 900
    answering: 300
    judging: 320
  credential_source: >
    OPENROUTER_API_KEY environment variable if set; otherwise parsed from
    D:/Github_API.txt line labelled Openrouter. The secret must never appear in
    stdout, logs, reports, or commits.

# ---------------------------------------------------------------------------
# Questions (phase 2, frozen before any arm runs)
# ---------------------------------------------------------------------------
question_generation:
  count: "1 per usable document (pilot n = number of usable docs, capped at 60)"
  constraints:
    - "answerable from that single document alone"
    - "must target a specific verifiable fact (number, date, name, or measurement)"
    - "must not be answerable from general knowledge alone without the document"
  output_schema: "{question, gold_answer, gold_value_exact, key_facts[]}"
  frozen_artifact: "benchmark/results/w6-v2-pilot/questions.frozen.json (hash recorded before arms start)"

# ---------------------------------------------------------------------------
# Arms (phase 3) - identical frozen model, identical questions
# ---------------------------------------------------------------------------
arms:
  raw:
    description: "full plaintext of the question's own source document"
    context_budget_chars: 6000
  rag:
    description: "basic RAG over ALL usable documents' chunks; hashed bag-of-words embeddings, cosine top-5"
    chunk_chars: 900
    chunk_overlap_chars: 120
    embedding: "deterministic hashed bag-of-words, dim 4096, L2-normalised (offline, reproducible)"
    top_k: 5
  tavonel:
    description: >
      compiled world: per-document LLM extraction into typed elements
      (definition | entity | metric | date_event | relation) carrying
      source_id provenance; retrieval scores elements lexically against the
      question, top-8 elements plus their source snippets.
    element_types: [definition, entity, metric, date_event, relation]

answer_contract:
  rules:
    - "answer in at most 80 words"
    - "end with a final line 'Sources: <comma-separated source ids>'"
  provenance_note: "provenance hit-rate is informational only; it does not enter correctness"

# ---------------------------------------------------------------------------
# Grading (phase 4)
# ---------------------------------------------------------------------------
grading:
  normalisation: "lowercase, strip punctuation and leading articles, collapse whitespace, strip thousand separators in numbers"
  critical_match: "normalised gold_value_exact appears in the normalised answer"
  judge: >
    one judge call per question scores ALL THREE arm answers independently,
    returning {arm: {score: 0|1, reason}}; score 1 iff the answer states the
    gold key fact correctly and contradicts no key fact; otherwise 0.
  correct_definition: "critical_match OR judge_score == 1"

metrics:
  primary: "accuracy per arm = mean(correct) over identical frozen questions"
  secondary: [critical_only_rate, provenance_hit_rate, mean_latency_seconds, api_failure_rate]

execution_integrity:
  arm_invalid_if_api_failure_rate_above: 0.20
  failures_recorded_not_silent: true

decision_rules:
  directional_signal: "acc(A) - acc(B) >= 0.10"
  inconclusive: "pairwise difference < 0.10 (explicitly expected at pilot n; no p-values will be claimed)"
  verdicts:
    - BLOCKED_ACQUISITION
    - INVALID_EXECUTION
    - INCONCLUSIVE_PILOT
    - TAVONEL_POSITIVE_SIGNAL
    - RAG_LEADS_SIGNAL
    - RAW_LEADS_SIGNAL
  honesty_clause: >
    failures, interruptions, uncertain effect sizes and wide confidence
    intervals are recorded verbatim in SUMMARY.md. Deleting or smoothing them
    is forbidden. A BLOCKED verdict with a cause diagnosis is a legitimate
    deliverable of this pilot.

reporting:
  results_dir: "benchmark/results/w6-v2-pilot"
  artifacts:
    - preregistration.snapshot.json
    - acquisition-report.json
    - questions.frozen.json
    - runs/raw.jsonl / runs/rag.jsonl / runs/tavonel.jsonl
    - evaluation.json
    - SUMMARY.md
