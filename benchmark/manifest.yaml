benchmark_id: akc-routing-benchmark-v1
corpus_version: "2.0.0"
created_at: "2026-07-29"
updated_at: "2026-07-30T04:15:00+09:00"
evaluator_version: "22.4-22.8-v1.0.0"
claim_policy:
  synthetic_results: contract_test_only
  official_claims_separate: true
  failed_pages_count_as_failures: true
profiles:
  - { id: ko_native, glob: "corpus/ko-native-pdf/**/*", target_pages: 200 }
  - { id: ko_scan, glob: "corpus/ko-scan/**/*", target_pages: 200 }
  - { id: en_native, glob: "corpus/en-native-pdf/**/*", target_pages: 100 }
  - { id: tables, glob: "corpus/tables/**/*", target_pages: 150 }
  - { id: formulas, glob: "corpus/formulas/**/*", target_pages: 100 }
  - { id: slides, glob: "corpus/slides/**/*", target_pages: 100 }
  - { id: handwriting, glob: "corpus/handwriting/**/*", target_pages: 100 }
  - { id: distorted, glob: "corpus/rotated-distorted/**/*", target_pages: 150 }
  - { id: adversarial, glob: "corpus/adversarial/**/*", target_pages: 100 }
providers:
  - native_document
  - paddleocr_vl_1_6
  - hpd_parsing_1b
  - infinity_parser2_flash
  - deepseek_ocr_2
  - olmocr_2
  - mineru
  - unlimited_ocr
  - mistral_ocr_4
repetitions:
  warm: 3
  cold: 2
hardware_profiles:
  - serverless_24gb
  - serverless_48gb
  - offline_80gb
