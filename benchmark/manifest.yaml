utility_weights:
  text_accuracy: 0.22
  reading_order: 0.14
  table_accuracy: 0.14
  formula_accuracy: 0.08
  structure_accuracy: 0.12
  provenance_coverage: 0.12
  hallucination_safety: 0.10
  normalized_speed: 0.08
hard_fail:
  - high_risk_numeric_below_threshold
  - high_risk_date_unit_below_threshold
  - severe_table_error
  - unsupported_statement
  - missing_page
  - repetition_loop
  - tenant_data_mixing
  - provenance_below_threshold
  - license_or_external_policy_violation
hard_fail_thresholds:
  high_risk_numeric_below_threshold: 1.00
  high_risk_date_unit_below_threshold: 1.00
  severe_table_error:
    comparison: "min(available(table_teds, table_cell_exactness)) < threshold"
    threshold: 0.50
