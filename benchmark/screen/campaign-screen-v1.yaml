# D10 arena screening campaign. Encodes core-runtime-arena.md section 5.
# Money is a decimal string. Planning constants are assumptions until A2a measures them.
schema: tavonel.screen-campaign.v1
campaign_id: d10-screen-v1
run_tag: v6-d10-screen-v1
hard_cap_usd: "350"
alert_percents: [50, 80, 100]
provider_retry_count: 0
rates_usd_per_hour:
  rtx4090_secure: "0.89"
  rtx_a6000_secure: "0.69"
  serverless_4090: "1.34"
  serverless_l4: "0.75"
# Each stage is reserved at its cap before any provider write. A1 is local and costs nothing.
# The remaining 90 USD up to the hard cap is an unreserved reserve for retries and price drift.
stages:
  - id: A0
    work: rights and licence snapshots, image builds with digests, weight sha256 manifests, one-page smoke per model
    page_runs: 6
    gpu: builder pod + rtx4090_secure
    cap_usd: "40"
    requires: []
  - id: A1
    work: native census 30 to 300 dev pages, local CPU
    page_runs: 300
    gpu: local-cpu
    cap_usd: "0"
    requires: []
  - id: A2a
    work: 30-dev smoke, reject broken candidates
    page_runs: 180
    gpu: rtx4090_secure
    cap_usd: "30"
    candidates: [MinerU-3.4.4, PaddleOCR-VL-1.6, OvisOCR2, DeepSeek-OCR-2, Infinity-Parser2-flash, olmOCR-2]
    max_provider_failure_rate: "0.20"
    requires: [A0]
  - id: A2b
    work: 300 dev paired, risk-routed pages x at most 4 finalists, plus born-digital incumbent control and audits
    page_runs: 1020
    gpu: rtx4090_secure
    cap_usd: "60"
    max_finalists: 4
    requires: [A1, A2a]
  - id: A3
    work: Jev off/on on dev crops plus second reader on held regions, calibrate per stratum
    page_runs: 7200
    gpu: rtx4090_secure
    cap_usd: "30"
    requires: [A2b]
  - id: A4-holdout
    work: 100 blind holdout pages, once, frozen recipe versus incumbent
    page_runs: 1200
    gpu: rtx4090_secure
    cap_usd: "40"
    requires: [A3]
  - id: A4-conc
    work: 1/2/4/8 workers on a fixed 200-page dev subset, champion only, serverless
    page_runs: 800
    gpu: serverless_4090
    cap_usd: "60"
    requires: [A3]
