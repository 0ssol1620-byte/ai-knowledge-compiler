# Screen strata: nine profiles from benchmark/manifest.yaml.
# Page targets: dev 300 / holdout 100. Korean strata (language: ko) must be >= 50% of pages
# (benchmark/corpus/CORPUS_POLICY.md). A target is a plan, not a measured corpus.
strata:
  - { id: ko_native,   language: ko, dev_pages: 60, holdout_pages: 20 }
  - { id: ko_scan,     language: ko, dev_pages: 60, holdout_pages: 20 }
  - { id: en_native,   language: en, dev_pages: 25, holdout_pages: 8 }
  - { id: tables,      language: ko, dev_pages: 35, holdout_pages: 12 }
  - { id: formulas,    language: en, dev_pages: 20, holdout_pages: 7 }
  - { id: slides,      language: ko, dev_pages: 25, holdout_pages: 8 }
  - { id: handwriting, language: ko, dev_pages: 20, holdout_pages: 7 }
  - { id: distorted,   language: ko, dev_pages: 35, holdout_pages: 12 }
  - { id: adversarial, language: en, dev_pages: 20, holdout_pages: 6 }
