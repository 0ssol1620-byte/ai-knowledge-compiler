# PaddleX/FastDeploy service configuration for the reproducible RTX 4090 lane.
# RunPod's base image reserves port 8001 for nginx, so metrics are isolated on
# 18119. The API stays loopback-only and ground truth is never mounted.
gpu-memory-utilization: 0.7
max-model-len: 16384
max-num-batched-tokens: 16384
max-num-seqs: 256
workers: 4
metrics-port: 18119
graph-optimization-config: '{"graph_opt_level":0,"use_cudagraph":true}'
