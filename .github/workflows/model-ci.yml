name: Model CI

on:
  pull_request:
    paths:
      - "infra/model-registry/**"
      - "infra/runpod/**"
      - "workers/gpu-*/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/model-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/model-registry/**"
      - "infra/runpod/**"
      - "workers/gpu-*/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      strict_registry:
        description: Require every candidate to have an exact revision
        type: boolean
        default: false
      run_provider_smoke:
        description: Run one approved synthetic Runpod staging request
        type: boolean
        default: false
      endpoint_id:
        description: Runpod staging endpoint ID
        type: string
        required: false
      expected_revision:
        description: Expected 40-64 character lowercase revision
        type: string
        required: false
      max_cost_usd:
        description: Maximum accepted worker-estimated cost
        type: string
        default: "0.01"

permissions:
  contents: read

jobs:
  scope:
    name: Classify current changed scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      full_qualification: ${{ steps.classify.outputs.full_qualification }}
      python: ${{ steps.classify.outputs.python }}
      images: ${{ steps.classify.outputs.images }}
      web: ${{ steps.classify.outputs.web }}
      db: ${{ steps.classify.outputs.db }}
      model: ${{ steps.classify.outputs.model }}
      joined: ${{ steps.classify.outputs.joined }}
      security_core: ${{ steps.classify.outputs.security_core }}
      dependency_audit: ${{ steps.classify.outputs.dependency_audit }}
      codeql_languages: ${{ steps.classify.outputs.codeql_languages }}
      tested_head: ${{ steps.identity.outputs.tested_head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Record the actual checkout identity
        id: identity
        run: echo "tested_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Classify exact anchor delta separately from cumulative PR scope
        id: classify
        run: |
          python scripts/classify_pr91_affected_scope.py \
            --repo "$GITHUB_WORKSPACE" --event-path "$GITHUB_EVENT_PATH" \
            --event-name "${{ github.event_name }}" --workflow-kind model \
            --output artifacts/pr91-affected-scope.json --github-output "$GITHUB_OUTPUT"
      - name: Preserve current classification even on refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-affected-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr91-affected-scope.json
          if-no-files-found: error
          retention-days: 14

  registry:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Sync immutable registry tooling
        run: |
          python -m pip install "uv==0.12.0"
          python -m uv sync --locked --extra dev
      - name: Validate registry
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.strict_registry }}" == "true" ]]; then
            .venv/bin/python infra/model-registry/validate_registry.py --strict
          else
            .venv/bin/python infra/model-registry/validate_registry.py
          fi
      - name: Worker static security checks
        run: .venv/bin/bandit -q -r workers/gpu-common workers/gpu-parser workers/gpu-knowledge workers/gpu-hpd workers/gpu-unlimited
      - name: Worker runtime tests
        working-directory: workers/gpu-common
        run: ../../.venv/bin/python -m unittest -v test_runtime.py
      - name: Production adapter contract tests
        run: .venv/bin/python -m pytest -q tests/test_gpu_production_adapters.py
      - name: RunPod baked-runtime qualification contracts
        run: |
          .venv/bin/python -m pytest -q \
            benchmark/tests/v6/test_runpod_pod_client.py \
            benchmark/tests/v6/test_ovis_runtime_image.py

  local-images:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        worker: [gpu-parser, gpu-knowledge, gpu-hpd, gpu-unlimited]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build model-free local handler image
        run: docker build --target local -f "workers/${{ matrix.worker }}/Dockerfile" -t "akc-${{ matrix.worker }}:contract" .
      - name: Run local self-test
        run: |
          docker run --rm \
            -e AKC_LOCAL_SELF_TEST=true \
            -e EXPERIMENT_ENABLED=true \
            "akc-${{ matrix.worker }}:contract" | tee "${RUNNER_TEMP}/self-test.json"
          jq -e '.ok == true and (.model_revision | test("^[0-9a-f]{40,64}$"))' "${RUNNER_TEMP}/self-test.json"
      - name: Scan local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: akc-${{ matrix.worker }}:contract
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate local-contract image SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: akc-${{ matrix.worker }}:contract
          format: spdx-json
          output-file: ${{ runner.temp }}/akc-${{ matrix.worker }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-contract-sbom-${{ matrix.worker }}-${{ github.sha }}
          path: ${{ runner.temp }}/akc-${{ matrix.worker }}.spdx.json
          retention-days: 30
          if-no-files-found: error

  provider-smoke:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full' && github.event_name == 'workflow_dispatch' && inputs.run_provider_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: model-staging
    steps:
      - name: Validate approved smoke inputs
        env:
          ENDPOINT_ID: ${{ inputs.endpoint_id }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          CALLBACK_HMAC_SECRET: ${{ secrets.GPU_CALLBACK_HMAC_SECRET }}
          MODEL_SMOKE_INPUT_URL: ${{ secrets.MODEL_SMOKE_INPUT_URL }}
          MODEL_SMOKE_INPUT_OBJECT_KEY: ${{ secrets.MODEL_SMOKE_INPUT_OBJECT_KEY }}
          MODEL_SMOKE_INPUT_SHA256: ${{ secrets.MODEL_SMOKE_INPUT_SHA256 }}
        run: |
          [[ "$ENDPOINT_ID" =~ ^[A-Za-z0-9_-]{3,80}$ ]]
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40,64}$ ]]
          [[ "$MAX_COST_USD" =~ ^0\.[0-9]{1,6}$ ]]
          [[ "$MAX_COST_USD" =~ [1-9] ]]
          test -n "$RUNPOD_API_KEY"
          test "${#CALLBACK_HMAC_SECRET}" -ge 32
          [[ "$MODEL_SMOKE_INPUT_URL" =~ ^https:// ]]
          [[ "$MODEL_SMOKE_INPUT_OBJECT_KEY" =~ ^tenants/ci-synthetic/ ]]
          [[ "$MODEL_SMOKE_INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Submit one synthetic page and enforce revision/cost cap
        env:
          ENDPOINT_ID: ${{ inputs.endpoint_id }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          CALLBACK_HMAC_SECRET: ${{ secrets.GPU_CALLBACK_HMAC_SECRET }}
          MODEL_SMOKE_INPUT_URL: ${{ secrets.MODEL_SMOKE_INPUT_URL }}
          MODEL_SMOKE_INPUT_OBJECT_KEY: ${{ secrets.MODEL_SMOKE_INPUT_OBJECT_KEY }}
          MODEL_SMOKE_INPUT_SHA256: ${{ secrets.MODEL_SMOKE_INPUT_SHA256 }}
        run: |
          trap 'rm -f "${RUNNER_TEMP}/callback-token" "${RUNNER_TEMP}/request.json"' EXIT
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          from pathlib import Path

          encode = lambda value: base64.urlsafe_b64encode(  # noqa: E731
              json.dumps(value, separators=(",", ":"), sort_keys=True).encode()
          ).rstrip(b"=").decode()
          now = int(time.time())
          header = encode({"alg": "HS256", "typ": "JWT"})
          claims = encode(
              {
                  "aud": "akc-gpu-worker",
                  "exp": now + 300,
                  "iat": now,
                  "job_id": "ci-model-smoke",
                  "scope": "gpu:execute",
                  "tenant_id": "ci-synthetic",
              }
          )
          signing_input = f"{header}.{claims}"
          signature = base64.urlsafe_b64encode(
              hmac.new(
                  os.environ["CALLBACK_HMAC_SECRET"].encode(),
                  signing_input.encode(),
                  hashlib.sha256,
              ).digest()
          ).rstrip(b"=").decode()
          Path(os.environ["RUNNER_TEMP"], "callback-token").write_text(
              f"{signing_input}.{signature}", encoding="ascii"
          )
          PY
          jq -n \
            --rawfile callback_token "${RUNNER_TEMP}/callback-token" \
            '{
              input: {
                job_id: "ci-model-smoke",
                tenant_id: "ci-synthetic",
                idempotency_key: ("ci-" + env.GITHUB_RUN_ID),
                callback_token: $callback_token,
                input_url: env.MODEL_SMOKE_INPUT_URL,
                input_object_key: env.MODEL_SMOKE_INPUT_OBJECT_KEY,
                input_sha256: env.MODEL_SMOKE_INPUT_SHA256,
                options: {mock_text: "safe synthetic smoke"}
              }
            }' > "${RUNNER_TEMP}/request.json"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 300 \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@${RUNNER_TEMP}/request.json" \
            "https://api.runpod.ai/v2/${ENDPOINT_ID}/runsync" > "${RUNNER_TEMP}/response.json"
          jq -e \
            --arg revision "$EXPECTED_REVISION" \
            --arg input_sha256 "sha256:${MODEL_SMOKE_INPUT_SHA256}" \
            --argjson cap "$MAX_COST_USD" \
            '.output.ok == true
              and .output.model_revision == $revision
              and .output.input_sha256 == $input_sha256
              and (.output.result_id | test("^sha256:[0-9a-f]{64}$"))
              and .output.metrics.metering_source == "worker_estimate_not_provider_invoice"
              and .output.metrics.estimated_cost_usd <= $cap' \
            "${RUNNER_TEMP}/response.json"

  affected-scope:
    name: 'Model scope: omitted jobs not executed'
    if: always()
    needs: [scope, registry, local-images, provider-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact selected current job outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          TESTED_HEAD: ${{ needs.scope.outputs.tested_head }}
          PROVIDER_SMOKE_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.run_provider_smoke }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def evaluate(needs, mode, expected_jobs, full_jobs, narrow_jobs, exemptions):
              if set(needs) != {"scope", *expected_jobs}:
                  raise ValueError("current needs keys differ from the declared job set")
              if needs["scope"].get("result") != "success":
                  raise ValueError("scope classification did not succeed")
              if mode not in {"full", "parser-delta", "entity-delta", "parser-entity-delta", "parser-entity-ocr-v3-delta"}:
                  raise ValueError("scope is unknown or requires a separately authorized broad run")
              if needs["scope"].get("outputs", {}).get("mode") != mode:
                  raise ValueError("scope output and aggregate mode differ")
              selected = set(full_jobs if mode == "full" else narrow_jobs)
              if not selected <= set(expected_jobs) or not set(exemptions) <= selected:
                  raise ValueError("invalid selected job contract")
              outcomes = {}
              for job in expected_jobs:
                  want = "skipped" if job not in selected or job in exemptions else "success"
                  actual = needs[job].get("result")
                  if actual != want:
                      raise ValueError(f"{job}: expected {want}, got {actual!r}")
                  outcomes[job] = {"result": actual, "execution": "not-executed" if want == "skipped" else "executed-current-run"}
              return {"mode": mode, "full_qualified": mode == "full", "outcomes": outcomes}

          if __name__ == "__main__":
              mode = os.environ["SCOPE_MODE"]
              exemptions = set()
              if mode == "full" and os.environ["PROVIDER_SMOKE_SELECTED"] != "true":
                  exemptions.add("provider-smoke")
              report = evaluate(json.loads(os.environ["NEEDS_JSON"]), mode,
                                ["registry","local-images","provider-smoke"], ["registry","local-images","provider-smoke"], [], exemptions)

              report.update({"run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                             "tested_head": os.environ["TESTED_HEAD"], "qualification": "full-current-run" if mode == "full" else "affected-only-not-full-qualified"})
              if mode == "parser-entity-ocr-v3-delta":
                  report["pending_debt"] = sorted(job for job, row in report["outcomes"].items() if row["execution"] == "not-executed")
              Path("artifacts").mkdir(exist_ok=True)
              Path("artifacts/affected-scope.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Model scope: omitted jobs not executed\n" + json.dumps(report, indent=2) + "\n")
                  if mode in {"parser-delta", "entity-delta", "parser-entity-delta", "parser-entity-ocr-v3-delta"}:
                      summary.write("Omitted jobs were not executed. This result does not qualify a full release or inherit historical PASS.\n")
                  if mode == "parser-entity-ocr-v3-delta":
                      summary.write("OCR v3 product-core ships in the packaged wheel and image; every job in pending_debt is open debt, not a pass.\n")
              print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve current outcome receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: affected-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/affected-scope.json
          if-no-files-found: error
          retention-days: 14

  full-qualification:
    name: Full qualification
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.mode == 'full'
    needs: [scope, registry, local-images, provider-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact selected current job outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          TESTED_HEAD: ${{ needs.scope.outputs.tested_head }}
          PROVIDER_SMOKE_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.run_provider_smoke }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def evaluate(needs, mode, expected_jobs, full_jobs, narrow_jobs, exemptions):
              if set(needs) != {"scope", *expected_jobs}:
                  raise ValueError("current needs keys differ from the declared job set")
              if needs["scope"].get("result") != "success":
                  raise ValueError("scope classification did not succeed")
              if mode not in {"full", "parser-delta"}:
                  raise ValueError("scope is unknown or requires a separately authorized broad run")
              if needs["scope"].get("outputs", {}).get("mode") != mode:
                  raise ValueError("scope output and aggregate mode differ")
              selected = set(full_jobs if mode == "full" else narrow_jobs)
              if not selected <= set(expected_jobs) or not set(exemptions) <= selected:
                  raise ValueError("invalid selected job contract")
              outcomes = {}
              for job in expected_jobs:
                  want = "skipped" if job not in selected or job in exemptions else "success"
                  actual = needs[job].get("result")
                  if actual != want:
                      raise ValueError(f"{job}: expected {want}, got {actual!r}")
                  outcomes[job] = {"result": actual, "execution": "not-executed" if want == "skipped" else "executed-current-run"}
              return {"mode": mode, "full_qualified": mode == "full", "outcomes": outcomes}

          if __name__ == "__main__":
              mode = os.environ["SCOPE_MODE"]
              exemptions = set()
              if mode == "full" and os.environ["PROVIDER_SMOKE_SELECTED"] != "true":
                  exemptions.add("provider-smoke")
              report = evaluate(json.loads(os.environ["NEEDS_JSON"]), mode,
                                ["registry","local-images","provider-smoke"], ["registry","local-images","provider-smoke"], [], exemptions)

              report.update({"run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                             "tested_head": os.environ["TESTED_HEAD"], "qualification": "full-current-run" if mode == "full" else "affected-only-not-full-qualified"})
              Path("artifacts").mkdir(exist_ok=True)
              Path("artifacts/full-qualification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Full qualification\n" + json.dumps(report, indent=2) + "\n")
                  if mode == "parser-delta":
                      summary.write("Omitted jobs were not executed. This result does not qualify a full release or inherit historical PASS.\n")
              print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve current outcome receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/full-qualification.json
          if-no-files-found: error
          retention-days: 14
