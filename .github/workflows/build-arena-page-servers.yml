name: Build arena page-server images

# WO-D10-0K. Builds the three arena page-server images (C0 and C3 from
# infra/runpod/v6/images/mineru-pipeline-akc/Dockerfile, C1 from
# infra/runpod/v6/images/paddleocr-vl-akc/Dockerfile), pushes each to GHCR under the
# commit it was built from, reads the manifest digest back from the registry and saves
# the build log section that holds the package listing. Build only: no test, no deploy,
# no cache service, no schedule. The only credential is this workflow's own token.
on:
  workflow_dispatch: {}
  push:
    branches:
      - codex/v34-c-arena-build
    paths:
      - ".github/workflows/build-arena-page-servers.yml"
      - "infra/runpod/v6/images/mineru-pipeline-akc/**"
      - "infra/runpod/v6/images/paddleocr-vl-akc/**"
      # The C1 Dockerfile copies these two files into the image (uv sync --locked).
      - "workers/gpu-common/pyproject.toml"
      - "workers/gpu-common/uv.lock"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-arena-page-servers-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # C0 and C3: every COPY names a file of the image directory, so that directory
          # is the build context.
          - slot: c0
            image: arena-mineru-pipeline-akc-c0
            dockerfile: infra/runpod/v6/images/mineru-pipeline-akc/Dockerfile
            context: infra/runpod/v6/images/mineru-pipeline-akc
            target: c0
            listing_marker: "--require-hashes"
          - slot: c3
            image: arena-mineru-pipeline-akc-c3
            dockerfile: infra/runpod/v6/images/mineru-pipeline-akc/Dockerfile
            context: infra/runpod/v6/images/mineru-pipeline-akc
            target: c3
            listing_marker: "--require-hashes"
          # C1: the Dockerfile copies workers/gpu-common/{pyproject.toml,uv.lock} and the
          # server and recipes from mineru-pipeline-akc/, so the context is the repository root.
          - slot: c1
            image: arena-paddleocr-vl-akc
            dockerfile: infra/runpod/v6/images/paddleocr-vl-akc/Dockerfile
            context: .
            target: ""
            listing_marker: "uv pip freeze"
    env:
      SLOT: ${{ matrix.slot }}
      IMAGE_NAME: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      BUILD_CONTEXT: ${{ matrix.context }}
      BUILD_TARGET: ${{ matrix.target }}
      LISTING_MARKER: ${{ matrix.listing_marker }}
    steps:
      - name: Create a dedicated large Docker data volume
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          build-mount-path: /var/lib/docker
          build-mount-path-ownership: root:root
          root-reserve-mb: 8192
          temp-reserve-mb: 100
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Restart Docker on the large volume
        run: |
          set -euo pipefail
          sudo systemctl restart docker
          available_kb="$(df --output=avail /var/lib/docker | tail -1)"
          test "$available_kb" -ge 57671680
          df -h / /var/lib/docker

      - name: Check out the pushed commit
        # WO-D10-0K2. Only what the builds read: the whole working tree no longer fits on the
        # root filesystem the large-disk step leaves (about 100 MB). Cone mode off, so a line
        # may name one file; every line is anchored at the repository root, with no wildcard.
        # The two image directories are every COPY source of C0 and C3 and the C1 server
        # files; the two gpu-common files are the rest of C1's. No step reads anything else.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /infra/runpod/v6/images/mineru-pipeline-akc/
            /infra/runpod/v6/images/paddleocr-vl-akc/
            /workers/gpu-common/pyproject.toml
            /workers/gpu-common/uv.lock

      - name: Check that every COPY source of the Dockerfile was checked out
        # Fails in seconds, naming the missing path, if the sparse list above misses a file.
        # COPY and ADD sources are read from the Dockerfile (continuation lines joined,
        # --flags dropped, the last word is the destination); a --from= COPY reads a stage.
        run: |
          set -euo pipefail
          if [ ! -f "$DOCKERFILE" ]; then
            echo "missing from the checkout: $DOCKERFILE (the Dockerfile itself)" >&2
            exit 1
          fi
          mapfile -t sources < <(awk '
            { line = line $0 }
            /\\$/ { sub(/\\$/, " ", line); next }
            { print line; line = "" }
          ' "$DOCKERFILE" | awk '
            toupper($1) == "COPY" || toupper($1) == "ADD" {
              stage = 0; n = 0
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^--from=/) { stage = 1 } else if ($i !~ /^--/) { args[++n] = $i }
              }
              if (!stage) { for (i = 1; i < n; i++) { print args[i] } }
            }
          ')
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "no COPY source found in $DOCKERFILE" >&2
            exit 1
          fi
          missing=0
          for source in "${sources[@]}"; do
            if [ -e "${BUILD_CONTEXT}/${source}" ]; then
              echo "COPY source present: ${BUILD_CONTEXT}/${source}"
            else
              echo "missing from the checkout: ${BUILD_CONTEXT}/${source} (COPY in $DOCKERFILE)" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Bind the source commit, the image tag and the base image
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$GITHUB_SHA" ]; then
            echo "checked-out commit $source_commit is not the workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          # Exactly one external base, pinned by digest; any other FROM names a stage.
          mapfile -t bases < <(grep -E '^FROM [^ ]+@sha256:[0-9a-f]{64}( |$)' "$DOCKERFILE" | awk '{print $2}')
          if [ "${#bases[@]}" -ne 1 ]; then
            echo "expected one digest-pinned base image in $DOCKERFILE, found ${#bases[@]}" >&2
            exit 1
          fi
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}"
          {
            echo "SOURCE_COMMIT=${source_commit}"
            echo "BASE_IMAGE=${bases[0]}"
            echo "IMAGE_REPOSITORY=${image_repository}"
            echo "IMAGE_TAG=${image_repository}:${source_commit}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Create a builder that keeps every line of the build log
        # BuildKit clips a step's log at 2 MiB and 200 KiB/s by default; pip inspect prints
        # more than that. -1 lifts both limits. A clipped listing still fails the job below.
        run: |
          set -euo pipefail
          docker buildx create \
            --driver docker-container \
            --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=-1 \
            --driver-opt env.BUILDKIT_STEP_LOG_MAX_SPEED=-1 \
            --name arena-builder \
            --use
          docker buildx inspect --bootstrap

      - name: Build and push the amd64 image
        run: |
          set -euo pipefail
          target_args=()
          if [ -n "$BUILD_TARGET" ]; then
            target_args=(--target "$BUILD_TARGET")
          fi
          docker buildx build \
            --platform linux/amd64 \
            --file "$DOCKERFILE" \
            "${target_args[@]}" \
            --tag "$IMAGE_TAG" \
            --metadata-file "${RUNNER_TEMP}/build-metadata.json" \
            --provenance=false \
            --sbom=false \
            --progress=plain \
            --push \
            "$BUILD_CONTEXT" 2>&1 | tee "${RUNNER_TEMP}/build.log"
          build_digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/build-metadata.json")"
          if ! [[ "$build_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the build reported no manifest digest: $build_digest" >&2
            exit 1
          fi
          echo "BUILD_DIGEST=${build_digest}" >> "$GITHUB_ENV"

      - name: Read the manifest digest back from the registry
        run: |
          set -euo pipefail
          registry_digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest}}' | jq -r '.digest')"
          docker logout ghcr.io
          if ! [[ "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "no manifest digest could be read back for $IMAGE_TAG: $registry_digest" >&2
            exit 1
          fi
          if [ "$registry_digest" != "$BUILD_DIGEST" ]; then
            echo "registry digest $registry_digest differs from the build's $BUILD_DIGEST" >&2
            exit 1
          fi
          echo "MANIFEST_DIGEST=${registry_digest}" >> "$GITHUB_ENV"

      - name: Save the build log section that holds the package listing
        # Every line of a plain BuildKit log starts with its step id (#12). The section is
        # every line of each step whose header names a command containing LISTING_MARKER.
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/build.log"
          listing="${RUNNER_TEMP}/package-listing.log"
          awk -v marker="$LISTING_MARKER" '
            NR == FNR { if ($0 ~ /^#[0-9]+ \[/ && index($0, marker)) { wanted[$1] = 1 }; next }
            ($1 in wanted) { print }
          ' "$build_log" "$build_log" > "$listing"
          awk -v marker="$LISTING_MARKER" '
            !($1 in seen) { seen[$1] = 1; steps++ }
            $2 == "DONE" { done[$1] = 1 }
            $2 == "CACHED" { cached[$1] = 1 }
            /output clipped/ { clipped = 1 }
            END {
              if (steps == 0) { print "no build step ran a command containing: " marker > "/dev/stderr"; exit 1 }
              if (clipped) { print "the package listing was clipped by the build log limit" > "/dev/stderr"; exit 1 }
              for (id in seen) {
                if (id in cached) { print "step " id " came from cache and printed no listing" > "/dev/stderr"; exit 1 }
                if (!(id in done)) { print "step " id " did not finish" > "/dev/stderr"; exit 1 }
              }
            }
          ' "$listing"

      - name: Write the build receipt and the job summary
        run: |
          set -euo pipefail
          listing="${RUNNER_TEMP}/package-listing.log"
          listing_sha256="sha256:$(sha256sum "$listing" | awk '{print $1}')"
          build_log_sha256="sha256:$(sha256sum "${RUNNER_TEMP}/build.log" | awk '{print $1}')"
          jq -n \
            --arg slot "$SLOT" \
            --arg image_tag "$IMAGE_TAG" \
            --arg image "${IMAGE_REPOSITORY}@${MANIFEST_DIGEST}" \
            --arg manifest_digest "$MANIFEST_DIGEST" \
            --arg base_image "$BASE_IMAGE" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg dockerfile "$DOCKERFILE" \
            --arg context "$BUILD_CONTEXT" \
            --arg target "$BUILD_TARGET" \
            --arg package_listing_sha256 "$listing_sha256" \
            --arg build_log_sha256 "$build_log_sha256" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{slot: $slot, image_tag: $image_tag, image: $image, manifest_digest: $manifest_digest,
              base_image: $base_image, source_commit: $source_commit, dockerfile: $dockerfile,
              context: $context, target: $target, package_listing: "package-listing.log",
              package_listing_sha256: $package_listing_sha256, build_log: "build.log",
              build_log_sha256: $build_log_sha256, workflow_run_id: $run_id}' \
            > "${RUNNER_TEMP}/build-receipt.json"
          {
            echo "### ${SLOT}: ${IMAGE_NAME}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image (pinned) | \`${IMAGE_REPOSITORY}@${MANIFEST_DIGEST}\` |"
            echo "| Manifest digest (read back from GHCR) | \`${MANIFEST_DIGEST}\` |"
            echo "| Base image | \`${BASE_IMAGE}\` |"
            echo "| Source commit | \`${SOURCE_COMMIT}\` |"
            echo "| Package listing (artifact \`package-listing.log\`) | \`${listing_sha256}\`, $(wc -l < "$listing") lines |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build receipt, log and package listing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arena-page-server-${{ matrix.slot }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-receipt.json
            ${{ runner.temp }}/build-metadata.json
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/package-listing.log
          retention-days: 30
          if-no-files-found: error
