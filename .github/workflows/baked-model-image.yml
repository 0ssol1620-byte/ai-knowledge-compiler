name: Baked model image

on:
  push:
    branches:
      - agent/folynta-trust-integration-v1
    paths:
      - ".github/workflows/baked-model-image.yml"
      - "benchmark/runpod_eval/bootstrap_ovisocr2_m1.sh"
      - "infra/runpod/v6/image_build_receipt.py"
      - "infra/runpod/v6/images/ovisocr2-m1/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  ovisocr2-m1:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODEL_REVISION: 65c619d374b55d4152e85150fc1b003700bc1f0c
      MODEL_ARTIFACT_SHA256: sha256:847f485bc71908a70075fe6b0d76609f52bc7f1e730c03670c764da56da08c9a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Bind source tree and immutable image tag
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -s -z | sha256sum | awk '{print "sha256:" $1}' > "${RUNNER_TEMP}/source-tree.sha256"
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/ovisocr2-m1"
          echo "IMAGE_TAG=${image_repository}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=${image_repository}" >> "$GITHUB_ENV"
      - name: Build and push frozen image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --file infra/runpod/v6/images/ovisocr2-m1/Dockerfile \
            --tag "$IMAGE_TAG" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${RUNNER_TEMP}/build-metadata.json" \
            --push .
          image_digest="$(jq -r '.["containerimage.digest"]' "${RUNNER_TEMP}/build-metadata.json")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=${IMAGE_REPOSITORY}@${image_digest}" >> "$GITHUB_ENV"
      - name: Generate independently downloadable SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: ${{ runner.temp }}/ovisocr2-m1.spdx.json
      - name: Scan immutable image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_DIGEST }}
          format: json
          output: ${{ runner.temp }}/ovisocr2-m1.trivy.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Create build-only integrity receipt
        shell: bash
        run: |
          set -euo pipefail
          python -m infra.runpod.v6.image_build_receipt \
            --source-commit "$GITHUB_SHA" \
            --source-tree-sha256 "$(cat "${RUNNER_TEMP}/source-tree.sha256")" \
            --dockerfile infra/runpod/v6/images/ovisocr2-m1/Dockerfile \
            --image-digest "$IMAGE_DIGEST" \
            --image-tag "$IMAGE_TAG" \
            --model-revision "$MODEL_REVISION" \
            --model-artifact-sha256 "$MODEL_ARTIFACT_SHA256" \
            --sbom "${RUNNER_TEMP}/ovisocr2-m1.spdx.json" \
            --vulnerability-scan "${RUNNER_TEMP}/ovisocr2-m1.trivy.json" \
            --output "${RUNNER_TEMP}/ovisocr2-m1.build-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ovisocr2-m1-build-integrity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-tree.sha256
            ${{ runner.temp }}/build-metadata.json
            ${{ runner.temp }}/ovisocr2-m1.spdx.json
            ${{ runner.temp }}/ovisocr2-m1.trivy.json
            ${{ runner.temp }}/ovisocr2-m1.build-receipt.json
          retention-days: 30
          if-no-files-found: error
