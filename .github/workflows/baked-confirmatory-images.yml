name: Baked confirmatory images

# SAFETY: workflow_dispatch is the ONLY trigger. Do not add push, pull_request,
# schedule, or any other automatic trigger to this file. A future accidental
# commit+push of this file to any branch must not be able to build or publish
# an image by itself — only an explicit human dispatch plus the exact
# confirm_ghcr_push arming string below can do that. See the in-workflow
# arming gate step for the second, independent layer of that protection.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Confirmatory image to build. No default — selection must be explicit."
        required: true
        type: choice
        options:
          - paddleocr-vl-1.6-fastdeploy-c8
          - mineru-3.4.4-vlm-c1
      confirm_ghcr_push:
        description: >-
          Type PUBLISH-IMMUTABLE-IMAGE exactly to arm the build+push+scan+receipt
          steps. Any other value (including empty or a near-miss) skips them —
          it does not fail the job.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  baked-confirmatory-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the receipt writer's import dependencies
        # infra.runpod.v6.image_build_receipt is stdlib-only, but `python -m`
        # imports the package first: infra/runpod/v6/__init__.py re-exports the
        # provider client, which imports httpx and benchmark.v6.contracts,
        # whose package __init__ imports cryptography for evidence signing.
        #
        # Versions come from pyproject.toml rather than being guessed here, so
        # the receipt is written by the same library versions the project
        # declares. Installing in the workflow keeps the contract modules
        # untouched; making __init__ lazy would edit files the whole
        # qualification chain depends on to work around a runner gap.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/receipt-deps.txt
          import tomllib

          wanted = {"httpx", "cryptography", "pyyaml"}
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          for spec in deps:
              name = spec.split(">")[0].split("=")[0].split("[")[0].strip()
              if name.lower() in wanted:
                  print(spec)
          PY
          cat /tmp/receipt-deps.txt
          python -m pip install --quiet --disable-pip-version-check -r /tmp/receipt-deps.txt
      - name: Free ephemeral runner space for the confirmatory model image
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # The paddleocr image pulls several multi-hundred-MB CUDA wheels
          # (nvidia-cublas-cu12 alone is 393 MB) plus a full paddlepaddle-gpu
          # build. On 2026-09-01 this step freed 13G -> 33G and the build still
          # died with "[Errno 28] No space left on device" partway through
          # nvidia-cublas. The allow-list below is therefore wider than it was,
          # and pip is told not to keep a second copy of every wheel it fetches.
          readonly targets=(
            /usr/local/lib/android
            /usr/share/dotnet
            /opt/ghc
            /opt/hostedtoolcache/CodeQL
            /usr/local/.ghcup
            /usr/local/share/powershell
            /usr/local/share/chromium
            /usr/local/lib/node_modules
            /usr/share/swift
            /usr/share/miniconda
          )
          for target in "${targets[@]}"; do
            case "$target" in
              /usr/local/lib/android|/usr/share/dotnet|/opt/ghc|/opt/hostedtoolcache/CodeQL) ;;
              /usr/local/.ghcup|/usr/local/share/powershell|/usr/local/share/chromium) ;;
              /usr/local/lib/node_modules|/usr/share/swift|/usr/share/miniconda) ;;
              *) echo "refusing unexpected cleanup target: $target" >&2; exit 64 ;;
            esac
            sudo rm -rf -- "$target"
          done
          sudo apt-get clean
          docker system prune --all --force
          # GitHub's ubuntu-24.04 runner carries a second, larger ephemeral
          # disk at /mnt (~65G free) that the Docker daemon does not use by
          # default. The MinerU image bakes a multi-GB safetensors checkout on
          # top of a CUDA base and exhausted / even after the cleanup above --
          # it reached the chmod on model.safetensors and died there. Moving
          # the daemon's data-root onto /mnt gives the build the larger disk
          # instead of the 72G root that also holds the runner's own toolchain.
          if [ -d /mnt ]; then
            df -h /mnt
            sudo systemctl stop docker docker.socket || true
            sudo mkdir -p /mnt/docker-data
            # The daemon needs <data-root>/tmp for "docker save" streams. It
            # creates the data-root itself but NOT this subdirectory, and syft
            # reading via the docker: scheme failed with
            #   unable to save image tar: stat /mnt/docker-data/tmp:
            #   no such file or directory
            sudo mkdir -p /mnt/docker-data/tmp
            # The daemon runs as root and writes here itself, so ownership is
            # set to match what it creates under a default data-root. Creating
            # the directory as the runner user and leaving it that way is the
            # other candidate cause of a save failure.
            sudo chown root:root /mnt/docker-data /mnt/docker-data/tmp
            sudo chmod 710 /mnt/docker-data
            sudo chmod 700 /mnt/docker-data/tmp
            printf '{ "data-root": "/mnt/docker-data" }\n' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
            docker info --format 'docker data-root: {{.DockerRootDir}}'
            # Prove the daemon can actually stream a save through its tmp
            # directory before a 20-minute build depends on it. hello-world is
            # ~20 KB, so this costs about a second.
            #
            # The daemon's own stderr is kept: an earlier version of this probe
            # discarded it with 2>/dev/null and reported "save is broken"
            # without saying why, which is barely better than not checking.
            if ! docker pull -q hello-world; then
              echo "cannot pull hello-world; skipping the save probe" >&2
              echo "(a pull failure is a network problem, not a storage one)" >&2
            else
              # Save to a real file, not /dev/null: the daemon rejects a
              # device with "invalid output path ... got a device", which the
              # first version of this probe misreported as a storage fault.
              probe_tar="$(mktemp -p "${RUNNER_TEMP}" savecheck.XXXXXX.tar)"
              save_err="$(docker save hello-world -o "$probe_tar" 2>&1)" && save_rc=0 || save_rc=$?
              rm -f "$probe_tar"
              if [ "${save_rc:-0}" -eq 0 ]; then
                echo "docker save works against the relocated data-root"
              else
                echo "docker save failed against /mnt/docker-data (rc=${save_rc})" >&2
                echo "daemon said: ${save_err}" >&2
                sudo ls -la /mnt/docker-data/ >&2 || true
                sudo stat -c '%n owner=%U:%G mode=%a' /mnt/docker-data /mnt/docker-data/tmp >&2 || true
                exit 34
              fi
            fi
            # Moving only the daemon is not enough. syft re-expands the pushed
            # image into TMPDIR to walk its layers, and on 2026-09-01 the
            # MinerU SBOM step failed with "no space left on device" writing
            # /tmp/stereoscope-*/oci-registry-image-* even though the image
            # itself had built and pushed successfully. Point the later steps'
            # scratch space at the same larger disk.
            sudo mkdir -p /mnt/runner-tmp
            sudo chmod 1777 /mnt/runner-tmp
            echo "TMPDIR=/mnt/runner-tmp" >> "$GITHUB_ENV"
            # NOT relocating the runner's own _diag directory. That was tried
            # on 2026-09-01 and killed the runner: the job died 90 seconds in,
            # mid-step, with no log and no annotation at all -- a worse failure
            # than the disk exhaustion it was meant to prevent, because it
            # destroyed the evidence too. The runner holds those log files
            # open; deleting the directory out from under it and substituting
            # a symlink is not survivable.
            #
            # The disk pressure that motivated it is addressed at the source
            # instead: the Dockerfile's pip installs are quiet, which removes
            # the per-package chatter and progress bars that produced most of
            # the volume.
          fi
          df -h /
          # The paddle build died once because the RUNNER ran out of root disk
          # writing its own _diag logs -- not because the build needed space.
          # Relocating _diag killed the runner outright, so the guard is here
          # instead: assert the root filesystem has real headroom before a
          # long build starts, and fail loudly now rather than 27 minutes in
          # with an unreadable log. 10 GiB is the floor recorded in
          # RUNTIME_QUALIFICATION notes for this workflow.
          root_free_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
          root_free_gib=$(( root_free_kib / 1024 / 1024 ))
          echo "root filesystem free: ${root_free_gib} GiB"
          if [ "$root_free_gib" -lt 10 ]; then
            echo "refusing to start: root free ${root_free_gib} GiB is below the 10 GiB floor" >&2
            exit 28
          fi
      - name: Resolve target-specific model identity
        id: model_identity
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            paddleocr-vl-1.6-fastdeploy-c8)
              echo "MODEL_REVISION=66317acc4c9fc17bd154591ce650735cd2855f3e" >> "$GITHUB_ENV"
              echo "MODEL_ARTIFACT_SHA256=sha256:40ca2a90af83f79a9adf2d5ddb7e32187e6956e45e5730119595be7305e06a53" >> "$GITHUB_ENV"
              ;;
            mineru-3.4.4-vlm-c1)
              # bff20d4a... is the WEIGHTS revision (opendatalab/MinerU2.5-Pro-2605-1.2B,
              # snapshot_download), not the source revision (opendatalab/MinerU,
              # 79d6d8d7..., git clone/checkout). image_build_receipt.py bakes this
              # value into model_revision, which build_runtime_qualification.py
              # compares against lineage.json targets["mineru-3.4.4-vlm-c1"].weights_revision.
              echo "MODEL_REVISION=bff20d4ae2bf202df9f45284b4d43681555a97ed" >> "$GITHUB_ENV"
              echo "MODEL_ARTIFACT_SHA256=sha256:1611a8892cc0e7e287d31c4a1b5af87652f0f6e4a3f80276b92b4c71f982de84" >> "$GITHUB_ENV"
              ;;
            *)
              echo "refusing unrecognized target: $TARGET" >&2
              exit 64
              ;;
          esac
          echo "DOCKERFILE_PATH=infra/runpod/v6/images/${TARGET}/Dockerfile" >> "$GITHUB_ENV"
      - name: Check confirmation arming string
        id: arming_gate
        shell: bash
        env:
          CONFIRM_GHCR_PUSH: ${{ inputs.confirm_ghcr_push }}
        run: |
          set -euo pipefail
          # A case-sensitive, exact-match bash string comparison, deliberately
          # NOT expressed as a workflow `if:` string equality: GitHub Actions
          # expression `==` compares strings case-INSENSITIVELY, which would
          # silently accept near-miss casing (e.g. publish-immutable-image) as
          # a valid arming string. This step is the single source of truth for
          # whether the build+push+scan+receipt+upload steps below are armed.
          if [ "$CONFIRM_GHCR_PUSH" = "PUBLISH-IMMUTABLE-IMAGE" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Bind source tree and immutable image tag
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          git ls-files -s -z | sha256sum | awk '{print "sha256:" $1}' > "${RUNNER_TEMP}/source-tree.sha256"
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}"
          echo "IMAGE_TAG=${image_repository}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=${image_repository}" >> "$GITHUB_ENV"
      - name: Bootstrap Buildx builder on the daemon storage
        shell: bash
        run: |
          set -euo pipefail
          # The docker-container driver runs BuildKit inside its own container
          # with its own /tmp, which is NOT the runner's relocated TMPDIR. On
          # 2026-09-01 the paddle build completed all 18 stages and then died
          # exporting the image:
          #   ResourceExhausted: mount callback failed on
          #   /tmp/containerd-mount*: failed to write compressed diff
          #
          # That /tmp lives inside the builder container, which means it sits
          # on the Docker data-root -- already moved to /mnt. What actually ran
          # out is the container's writable layer, so the fix is to stop
          # writing the export through it: the docker driver uses the daemon
          # directly, and the daemon's storage is on the larger disk.
          #
          # The docker-container driver was only needed for attestations, and
          # this workflow already passes --provenance=false --sbom=false and
          # generates its SBOM independently in a later step. So nothing is
          # lost by using the default driver here.
          docker buildx create \
            --driver docker \
            --name folynta-confirmatory-builder \
            --use 2>/dev/null \
            || docker buildx use default
          docker buildx inspect --bootstrap
          docker info --format 'docker data-root: {{.DockerRootDir}}'
          df -h /mnt
      - name: Build and push confirmatory image
        if: steps.arming_gate.outputs.armed == 'true'
        shell: bash
        env:
          # Needed to fetch the rebuilt fastdeploy wheel from this repository's
          # release assets; contents: read at job level covers it.
          GH_ASSET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The paddle image fetches its rebuilt fastdeploy wheel from this
          # repository's release assets, and the repository is private, so the
          # download needs a token. Passed as a BuildKit secret so it is never
          # written into a layer or visible in `docker history`, and removed
          # from the runner as soon as the build returns.
          umask 077
          printf '%s' "${GH_ASSET_TOKEN}" > "${RUNNER_TEMP}/gh_token"
          trap 'rm -f "${RUNNER_TEMP}/gh_token"' EXIT
          docker buildx build \
            --secret id=gh_token,src="${RUNNER_TEMP}/gh_token" \
            --file "$DOCKERFILE_PATH" \
            --tag "$IMAGE_TAG" \
            --provenance=false \
            --sbom=false \
            --metadata-file "${RUNNER_TEMP}/build-metadata.json" \
            --push .
          image_digest="$(jq -r '.["containerimage.digest"]' "${RUNNER_TEMP}/build-metadata.json")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=${IMAGE_REPOSITORY}@${image_digest}" >> "$GITHUB_ENV"
          # The docker driver has no builder container to remove; tolerate
          # its absence so cleanup does not fail the run.
          docker buildx rm folynta-confirmatory-builder 2>/dev/null || true
          # Reclaim space WITHOUT deleting the image just built. The previous
          # form used --all, which removes images not referenced by a running
          # container -- including this one -- so the later scan found
          # "local: <not present>" and fell back to pulling from GHCR, which is
          # exactly the transfer that keeps resetting mid-layer.
          # Record whether the prune is what removes <data-root>/tmp, rather
          # than assuming it. If tmp is present before and absent after, the
          # attribution is proven by this line alone.
          docker builder prune --all --force
          docker container prune --force
          docker volume prune --force
          # The daemon removes <data-root>/tmp during a prune and does not
          # recreate it until it next needs it -- but "docker save" fails
          # outright if it is missing. The save-probe in the setup step passed,
          # then twenty minutes later syft died with
          #   unable to save image tar: stat /mnt/docker-data/tmp:
          #   no such file or directory
          # So it is restored here, after the prune that removes it, rather
          # than only once at setup.
          # Export the image as an OCI layout on disk so the SBOM and scan
          # steps need neither the registry nor `docker save`.
          #
          # Measured, not assumed: the setup probe's own save created
          # <data-root>/tmp, used it, and removed it one second later --
          #   02:38:06  docker save works against the relocated data-root
          #   02:38:07  tmp before prune: ABSENT
          # -- so that directory is transient by design, and recreating it
          # after the prune would fail identically on the next save. skopeo
          # reads the image out of the daemon and writes an OCI directory
          # without streaming a tar through that path.
          if command -v skopeo >/dev/null 2>&1; then
            rm -rf "${RUNNER_TEMP}/image-oci"
            if skopeo copy --quiet "docker-daemon:${IMAGE_TAG}" \
                 "oci:${RUNNER_TEMP}/image-oci:scan" 2>"${RUNNER_TEMP}/skopeo.err"; then
              echo "IMAGE_OCI_DIR=${RUNNER_TEMP}/image-oci" >> "$GITHUB_ENV"
              du -sh "${RUNNER_TEMP}/image-oci"
              echo "exported OCI layout for the SBOM and scan steps"
            else
              echo "skopeo copy failed; steps fall back to the registry" >&2
              cat "${RUNNER_TEMP}/skopeo.err" >&2 || true
            fi
          else
            echo "skopeo not available; steps fall back to the registry" >&2
          fi
          # Keeping the image costs disk, and the SBOM and scan steps still
          # need room. Report what is left so a later ENOSPC is attributable.
          echo "after prune, image retained:"
          if ! docker image inspect "$IMAGE_TAG" --format '  {{index .RepoDigests 0}}' 2>/dev/null; then
            echo "  WARNING: image not present locally; the scan will pull"
          fi
          df -h / /mnt
          # syft re-expands the pushed image from the registry into TMPDIR to
          # walk its layers, and TMPDIR now shares /mnt with the daemon's
          # data-root. On 2026-09-01 that disk filled and the SBOM step failed
          # with "no space left on device" writing /mnt/runner-tmp/stereoscope-*
          # -- after the image had already built and pushed successfully.
          # Reclaim the build cache explicitly (prune --all does not remove it)
          # and report the result so a future failure has the numbers.
          docker buildx prune --all --force || true
          sudo rm -rf /mnt/docker-data/tmp /mnt/docker-data/buildkit || true
          echo "disk available to the SBOM step:"
          df -h / /mnt
          df -h /
      - name: Confirm the local image matches the pushed digest
        if: steps.arming_gate.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The scan below reads the image from the local daemon rather than
          # re-pulling it, because pulling paddle's multi-hundred-MB CUDA
          # layers from GHCR failed mid-stream:
          #   libphi_gpu.so: failed to copy: stream error: stream ID 75;
          #   PROTOCOL_ERROR; received from peer
          #
          # Scanning a local image is only equivalent if it IS the pushed
          # image, so verify the local tag resolves to the digest that was
          # published, and fail if it does not. Without this, "scan locally"
          # would be a way to scan something other than what shipped.
          local_digest="$(docker image inspect "$IMAGE_TAG" \
            --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          echo "local:  ${local_digest:-<not present>}"
          echo "pushed: ${IMAGE_DIGEST}"
          if [ -z "$local_digest" ]; then
            echo "local image absent; the scan will pull from the registry" >&2
          elif [ "$local_digest" != "$IMAGE_DIGEST" ]; then
            echo "local image does not match the pushed digest" >&2
            exit 35
          else
            echo "verify the local image is the pushed image: match"
          fi
      - name: Generate independently downloadable SBOM
        if: steps.arming_gate.outputs.armed == 'true'
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          # The docker: scheme is explicit on purpose. syft's default for a
          # bare tag is "use the Docker daemon, and silently fall back to
          # pulling from the registry if it is not there" -- and that fallback
          # re-downloaded ~15 GB of layers that were already local, then ran
          # out of space expanding them into TMPDIR:
          #   oci-registry: unable to populate layer cache ...
          #   no space left on device
          # The step above verifies this local image is the pushed one, so the
          # SBOM still describes exactly what shipped.
          image: ${{ env.IMAGE_OCI_DIR && format('oci-dir:{0}', env.IMAGE_OCI_DIR) || env.IMAGE_TAG }}
          format: spdx-json
          output-file: ${{ runner.temp }}/confirmatory-image.spdx.json
      - name: Scan immutable image digest
        if: steps.arming_gate.outputs.armed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The paddle image ships libpaddle.so, a multi-hundred-MB CUDA
          # binary, and on 2026-09-01 Trivy gave up analysing it:
          #   failed to analyze .../paddle/base/libpaddle.so:
          #   semaphore acquire: context deadline exceeded
          # That is a timeout, not a finding. The default 5m budget is
          # raised so the scan can finish. The severity gate is untouched:
          # a real CRITICAL still fails the build exactly as before.
          TRIVY_TIMEOUT: 30m
          # Trivy's troubleshooting guide, "Running out of space during image
          # scans": layers are processed in parallel by default, and "if each
          # layer contains large files, disk space may be consumed rapidly...
          # by specifying a small value such as --parallel 1, parallelism is
          # reduced, which can mitigate the issue". This image ships the
          # paddlepaddle CUDA runtime -- libpaddle.so, libphi_gpu.so and
          # friends -- which is exactly that case.
          #
          # The guide's third suggestion, --skip-files/--skip-dirs, is
          # deliberately NOT used: skipping the CUDA binaries would make the
          # scan pass by not looking at them, and the receipt asserts zero
          # critical vulnerabilities in the image rather than in a chosen
          # subset of it.
          TRIVY_PARALLEL: "1"
          # Same root cause as the SBOM step: re-fetching an image that is
          # already local. Trivy resolves a bare tag against the Docker daemon
          # first, but only if it can reach it, so the socket is named
          # explicitly rather than left to discovery.
          TRIVY_DOCKER_HOST: unix:///var/run/docker.sock
        with:
          # The local tag, verified above to resolve to IMAGE_DIGEST. Reading
          # from the daemon keeps paddle's largest layers off the network,
          # which is what the registry stream reset on.
          # Same on-disk OCI layout the SBOM step reads, when the export
          # succeeded; the tag (daemon) otherwise. Neither path pulls from the
          # registry, which is what reset mid-layer on this image.
          image-ref: ${{ env.IMAGE_OCI_DIR && format('oci-dir:{0}', env.IMAGE_OCI_DIR) || env.IMAGE_TAG }}
          format: json
          output: ${{ runner.temp }}/confirmatory-image.trivy.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish the scan findings even when the gate fails
        # Without this the scan JSON is lost whenever the gate trips, because
        # the artifact upload runs only after a passing scan. Three rounds of
        # remediation on 2026-09-01 were driven by inferring the findings from
        # the SBOM instead of reading them, and the inference was wrong. Fixing
        # a gate you cannot see is guesswork; this makes the evidence
        # survive the failure it describes.
        if: always() && steps.arming_gate.outputs.armed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: confirmatory-image-trivy-${{ inputs.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/confirmatory-image.trivy.json
          if-no-files-found: warn
          retention-days: 30
      - name: Create build-only integrity receipt
        if: steps.arming_gate.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m infra.runpod.v6.image_build_receipt \
            --source-commit "$GITHUB_SHA" \
            --source-tree-sha256 "$(cat "${RUNNER_TEMP}/source-tree.sha256")" \
            --dockerfile "$DOCKERFILE_PATH" \
            --image-digest "$IMAGE_DIGEST" \
            --image-tag "$IMAGE_TAG" \
            --model-revision "$MODEL_REVISION" \
            --model-artifact-sha256 "$MODEL_ARTIFACT_SHA256" \
            --sbom "${RUNNER_TEMP}/confirmatory-image.spdx.json" \
            --vulnerability-scan "${RUNNER_TEMP}/confirmatory-image.trivy.json" \
            --output "${RUNNER_TEMP}/confirmatory-image.build-receipt.json"
      - name: Upload build integrity artifacts
        if: steps.arming_gate.outputs.armed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: confirmatory-image-build-integrity-${{ inputs.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-tree.sha256
            ${{ runner.temp }}/build-metadata.json
            ${{ runner.temp }}/confirmatory-image.spdx.json
            ${{ runner.temp }}/confirmatory-image.trivy.json
            ${{ runner.temp }}/confirmatory-image.build-receipt.json
          retention-days: 30
          if-no-files-found: error
