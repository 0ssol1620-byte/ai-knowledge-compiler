name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    # Private repositories need GitHub Advanced Security for CodeQL/SARIF.
    # Keep the source scan available without turning a missing paid feature
    # into a false application failure; set AKC_GHAS_ENABLED=true once enabled.
    if: github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  filesystem-and-iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: repository-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-sbom
          path: repository-sbom.cdx.json
          retention-days: 30

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit Python dependency resolution
        run: |
          python -m pip install "uv==0.13.4"
          python -m uv sync --locked --extra dev
          python -m uv pip check --python .venv/bin/python
          python -m uv run --locked --extra dev pip-audit \
            --local --skip-editable --progress-spinner off
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit locked JavaScript dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level high

  application-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: scheduler
            dockerfile: services/scheduler/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: cpu-document
            dockerfile: workers/cpu-document/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build immutable candidate image locally
        run: |
          docker build \
            --file "${{ matrix.image.dockerfile }}" \
            --tag "akc-${{ matrix.image.name }}:${GITHUB_SHA}" \
            .
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: akc-${{ matrix.image.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate candidate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: akc-${{ matrix.image.name }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-${{ matrix.image.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
          retention-days: 30
          if-no-files-found: error

  ip-privilege-guard:
    # RED-family claim-level analysis is prepared for external counsel and does
    # not enter version control. docs/ip/.gitignore and the pre-commit hook are
    # the local controls; both are per-clone and neither survives `--no-verify`,
    # so this job is the one control that cannot be skipped by the person making
    # the commit.
    name: IP privilege guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Scan the tracked tree
        run: python scripts/ip_privilege_guard.py
      - name: Install the guard's test runner
        run: python -m pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"
      - name: Guard's own tests
        run: python -m pytest tests/security/test_ip_privilege_guard.py -q
