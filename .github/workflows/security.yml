name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scope:
    name: Classify current changed scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      full_qualification: ${{ steps.classify.outputs.full_qualification }}
      python: ${{ steps.classify.outputs.python }}
      images: ${{ steps.classify.outputs.images }}
      web: ${{ steps.classify.outputs.web }}
      db: ${{ steps.classify.outputs.db }}
      model: ${{ steps.classify.outputs.model }}
      joined: ${{ steps.classify.outputs.joined }}
      security_core: ${{ steps.classify.outputs.security_core }}
      dependency_audit: ${{ steps.classify.outputs.dependency_audit }}
      codeql_languages: ${{ steps.classify.outputs.codeql_languages }}
      tested_head: ${{ steps.identity.outputs.tested_head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Record the actual checkout identity
        id: identity
        run: echo "tested_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Classify exact anchor delta separately from cumulative PR scope
        id: classify
        run: |
          python scripts/classify_pr91_affected_scope.py \
            --repo "$GITHUB_WORKSPACE" --event-path "$GITHUB_EVENT_PATH" \
            --event-name "${{ github.event_name }}" --workflow-kind security \
            --output artifacts/pr91-affected-scope.json --github-output "$GITHUB_OUTPUT"
      - name: Preserve current classification even on refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-affected-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr91-affected-scope.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    needs: scope
    if: needs.scope.result == 'success' && (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
    # Private repositories need GitHub Advanced Security for CodeQL/SARIF.
    # Keep the source scan available without turning a missing paid feature
    # into a false application failure; set AKC_GHAS_ENABLED=true once enabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.codeql_languages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full' && github.event_name == 'pull_request' && (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  filesystem-and-iac:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.security_core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
      - name: Summarize scanner finding identities
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: python3 scripts/summarize_trivy_sarif.py trivy-results.sarif
      - name: Preserve filesystem scanner evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: filesystem-trivy-sarif-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 14
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: cyclonedx-json
          output-file: repository-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-sbom
          path: repository-sbom.cdx.json
          retention-days: 30

  dependency-audit:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit Python dependency resolution
        run: |
          python -m pip install "uv==0.12.0"
          python -m uv sync --locked --extra dev
          python -m uv pip check --python .venv/bin/python
          python -m uv run --locked --extra dev pip-audit \
            --local --skip-editable --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Audit locked JavaScript dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          # extract-zip is only in the Lighthouse/Puppeteer development toolchain.
          # The two symlink traversal advisories have no published fix as of
          # 2026-09-27; remove these exact exceptions when an upstream patched
          # release exists. pnpm 11.9.0 `audit --ignore` only records the ids in
          # this checkout's pnpm-workspace.yaml auditConfig and exits 0, so this
          # line does not gate the development tree (open there: braces
          # GHSA-vfj7-8cjw-p6xm, high). It stays after the --prod audit so that
          # audit ignores nothing; the auditConfig it writes is never committed.
          pnpm audit --audit-level high \
            --ignore GHSA-jmr9-qjv8-65gv \
            --ignore GHSA-7pqw-9j4j-h8q3
          # The committed extract-zip patch must still block GHSA-jmr9-qjv8-65gv.
          node scripts/verify-dependency-patches.mjs

  application-images:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: scheduler
            dockerfile: services/scheduler/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: cpu-document
            dockerfile: workers/cpu-document/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build immutable candidate image locally
        run: |
          docker build \
            --file "${{ matrix.image.dockerfile }}" \
            --tag "akc-${{ matrix.image.name }}:${GITHUB_SHA}" \
            .
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: akc-${{ matrix.image.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate candidate image SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: akc-${{ matrix.image.name }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-sbom-${{ matrix.image.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
          retention-days: 30
          if-no-files-found: error

  ip-privilege-guard:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.security_core == 'true'
    # RED-family claim-level analysis is prepared for external counsel and does
    # not enter version control. docs/ip/.gitignore and the pre-commit hook are
    # the local controls; both are per-clone and neither survives `--no-verify`,
    # so this job is the one control that cannot be skipped by the person making
    # the commit.
    name: IP privilege guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Scan the tracked tree
        run: python scripts/ip_privilege_guard.py
      - name: Install the guard's test runner
        run: python -m pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"
      - name: Guard's own tests
        run: python -m pytest tests/security/test_ip_privilege_guard.py -q

  affected-scope:
    name: Security selected scope (not full qualification)
    if: always()
    needs: [scope, codeql, dependency-review, filesystem-and-iac, dependency-audit, application-images, ip-privilege-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact selected current job outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          TESTED_HEAD: ${{ needs.scope.outputs.tested_head }}
          GHAS_AVAILABLE: ${{ github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true' }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def evaluate(needs, mode, expected_jobs, full_jobs, narrow_jobs, exemptions):
              if set(needs) != {"scope", *expected_jobs}:
                  raise ValueError("current needs keys differ from the declared job set")
              if needs["scope"].get("result") != "success":
                  raise ValueError("scope classification did not succeed")
              if mode not in {"full", "parser-delta", "entity-delta", "parser-entity-delta", "parser-entity-ocr-v3-delta"}:
                  raise ValueError("scope is unknown or requires a separately authorized broad run")
              if needs["scope"].get("outputs", {}).get("mode") != mode:
                  raise ValueError("scope output and aggregate mode differ")
              selected = set(full_jobs if mode == "full" else narrow_jobs)
              if not selected <= set(expected_jobs) or not set(exemptions) <= selected:
                  raise ValueError("invalid selected job contract")
              outcomes = {}
              for job in expected_jobs:
                  want = "skipped" if job not in selected or job in exemptions else "success"
                  actual = needs[job].get("result")
                  if actual != want:
                      raise ValueError(f"{job}: expected {want}, got {actual!r}")
                  outcomes[job] = {"result": actual, "execution": "not-executed" if want == "skipped" else "executed-current-run"}
              return {"mode": mode, "full_qualified": mode == "full", "outcomes": outcomes}

          if __name__ == "__main__":
              mode = os.environ["SCOPE_MODE"]
              exemptions = set()
              if os.environ["GHAS_AVAILABLE"] != "true":
                  exemptions.add("codeql")
              if mode == "full" and (os.environ["GHAS_AVAILABLE"] != "true" or os.environ["IS_PULL_REQUEST"] != "true"):
                  exemptions.add("dependency-review")
              report = evaluate(json.loads(os.environ["NEEDS_JSON"]), mode,
                                ["codeql","dependency-review","filesystem-and-iac","dependency-audit","application-images","ip-privilege-guard"], ["codeql","dependency-review","filesystem-and-iac","dependency-audit","application-images","ip-privilege-guard"], ["codeql","filesystem-and-iac","ip-privilege-guard"], exemptions)

              report.update({"run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                             "tested_head": os.environ["TESTED_HEAD"], "qualification": "full-current-run" if mode == "full" else "affected-only-not-full-qualified"})
              if mode == "parser-entity-ocr-v3-delta":
                  report["pending_debt"] = sorted(job for job, row in report["outcomes"].items() if row["execution"] == "not-executed")
              Path("artifacts").mkdir(exist_ok=True)
              Path("artifacts/affected-scope.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Security selected scope (not full qualification)\n" + json.dumps(report, indent=2) + "\n")
                  if mode in {"parser-delta", "entity-delta", "parser-entity-delta", "parser-entity-ocr-v3-delta"}:
                      summary.write("Omitted jobs were not executed. This result does not qualify a full release or inherit historical PASS.\n")
                  if mode == "parser-entity-ocr-v3-delta":
                      summary.write("OCR v3 product-core ships in the packaged wheel and image; every job in pending_debt is open debt, not a pass.\n")
              print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve current outcome receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: affected-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/affected-scope.json
          if-no-files-found: error
          retention-days: 14

  full-qualification:
    name: Full qualification
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.mode == 'full'
    needs: [scope, codeql, dependency-review, filesystem-and-iac, dependency-audit, application-images, ip-privilege-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact selected current job outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          TESTED_HEAD: ${{ needs.scope.outputs.tested_head }}
          GHAS_AVAILABLE: ${{ github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true' }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def evaluate(needs, mode, expected_jobs, full_jobs, narrow_jobs, exemptions):
              if set(needs) != {"scope", *expected_jobs}:
                  raise ValueError("current needs keys differ from the declared job set")
              if needs["scope"].get("result") != "success":
                  raise ValueError("scope classification did not succeed")
              if mode not in {"full", "parser-delta"}:
                  raise ValueError("scope is unknown or requires a separately authorized broad run")
              if needs["scope"].get("outputs", {}).get("mode") != mode:
                  raise ValueError("scope output and aggregate mode differ")
              selected = set(full_jobs if mode == "full" else narrow_jobs)
              if not selected <= set(expected_jobs) or not set(exemptions) <= selected:
                  raise ValueError("invalid selected job contract")
              outcomes = {}
              for job in expected_jobs:
                  want = "skipped" if job not in selected or job in exemptions else "success"
                  actual = needs[job].get("result")
                  if actual != want:
                      raise ValueError(f"{job}: expected {want}, got {actual!r}")
                  outcomes[job] = {"result": actual, "execution": "not-executed" if want == "skipped" else "executed-current-run"}
              return {"mode": mode, "full_qualified": mode == "full", "outcomes": outcomes}

          if __name__ == "__main__":
              mode = os.environ["SCOPE_MODE"]
              exemptions = set()
              if os.environ["GHAS_AVAILABLE"] != "true":
                  exemptions.add("codeql")
              if mode == "full" and (os.environ["GHAS_AVAILABLE"] != "true" or os.environ["IS_PULL_REQUEST"] != "true"):
                  exemptions.add("dependency-review")
              report = evaluate(json.loads(os.environ["NEEDS_JSON"]), mode,
                                ["codeql","dependency-review","filesystem-and-iac","dependency-audit","application-images","ip-privilege-guard"], ["codeql","dependency-review","filesystem-and-iac","dependency-audit","application-images","ip-privilege-guard"], [], exemptions)

              report.update({"run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                             "tested_head": os.environ["TESTED_HEAD"], "qualification": "full-current-run" if mode == "full" else "affected-only-not-full-qualified"})
              Path("artifacts").mkdir(exist_ok=True)
              Path("artifacts/full-qualification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Full qualification\n" + json.dumps(report, indent=2) + "\n")
                  if mode == "parser-delta":
                      summary.write("Omitted jobs were not executed. This result does not qualify a full release or inherit historical PASS.\n")
              print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve current outcome receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/full-qualification.json
          if-no-files-found: error
          retention-days: 14
