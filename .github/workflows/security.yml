name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    # Private repositories need GitHub Advanced Security for CodeQL/SARIF.
    # Keep the source scan available without turning a missing paid feature
    # into a false application failure; set AKC_GHAS_ENABLED=true once enabled.
    if: github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  filesystem-and-iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: repository-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-sbom
          path: repository-sbom.cdx.json
          retention-days: 30

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit Python dependency resolution
        run: |
          python -m pip install "uv==0.12.0"
          python -m uv sync --locked --extra dev
          python -m uv pip check --python .venv/bin/python
          python -m uv run --locked --extra dev pip-audit \
            --local --skip-editable --progress-spinner off
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Audit locked JavaScript dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          # extract-zip is only in the Lighthouse/Puppeteer development toolchain.
          # The two symlink traversal advisories have no published fix as of
          # 2026-09-27. Keep every other development advisory gated, and remove
          # these exact exceptions when an upstream patched release exists.
          pnpm audit --audit-level high \
            --ignore GHSA-jmr9-qjv8-65gv \
            --ignore GHSA-7pqw-9j4j-h8q3

  application-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: scheduler
            dockerfile: services/scheduler/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: cpu-document
            dockerfile: workers/cpu-document/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build immutable candidate image locally
        run: |
          docker build \
            --file "${{ matrix.image.dockerfile }}" \
            --tag "akc-${{ matrix.image.name }}:${GITHUB_SHA}" \
            .
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: akc-${{ matrix.image.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate candidate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: akc-${{ matrix.image.name }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sbom-${{ matrix.image.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
          retention-days: 30
          if-no-files-found: error

  ip-privilege-guard:
    # RED-family claim-level analysis is prepared for external counsel and does
    # not enter version control. docs/ip/.gitignore and the pre-commit hook are
    # the local controls; both are per-clone and neither survives `--no-verify`,
    # so this job is the one control that cannot be skipped by the person making
    # the commit.
    name: IP privilege guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Scan the tracked tree
        run: python scripts/ip_privilege_guard.py
      - name: Install the guard's test runner
        run: python -m pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"
      - name: Guard's own tests
        run: python -m pytest tests/security/test_ip_privilege_guard.py -q
