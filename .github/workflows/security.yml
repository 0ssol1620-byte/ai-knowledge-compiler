name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    # Private repositories need GitHub Advanced Security for CodeQL/SARIF.
    # Keep the source scan available without turning a missing paid feature
    # into a false application failure; set AKC_GHAS_ENABLED=true once enabled.
    if: github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  filesystem-and-iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event.repository.private == false || vars.AKC_GHAS_ENABLED == 'true')
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: cyclonedx-json
          output-file: repository-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-sbom
          path: repository-sbom.cdx.json
          retention-days: 30

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit Python dependency resolution
        run: |
          python -m pip install "uv==0.12.0"
          python -m uv sync --locked --extra dev
          python -m uv pip check --python .venv/bin/python
          python -m uv run --locked --extra dev pip-audit \
            --local --skip-editable --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Audit locked JavaScript dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

  application-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: scheduler
            dockerfile: services/scheduler/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: cpu-document
            dockerfile: workers/cpu-document/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build immutable candidate image locally
        run: |
          docker build \
            --file "${{ matrix.image.dockerfile }}" \
            --tag "akc-${{ matrix.image.name }}:${GITHUB_SHA}" \
            .
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: akc-${{ matrix.image.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate candidate image SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: akc-${{ matrix.image.name }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-sbom-${{ matrix.image.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/akc-${{ matrix.image.name }}.spdx.json
          retention-days: 30
          if-no-files-found: error
