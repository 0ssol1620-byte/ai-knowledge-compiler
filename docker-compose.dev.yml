name: akc-dev

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  networks: [akc]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg17
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${AKC_DEV_POSTGRES_DB:-akc}
      POSTGRES_USER: ${AKC_DEV_POSTGRES_USER:-akc}
      POSTGRES_PASSWORD: ${AKC_DEV_POSTGRES_PASSWORD:-akc_dev_only_change_me}
    ports:
      - "127.0.0.1:${AKC_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7.4.2-alpine
    profiles: [durable-queue]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${AKC_DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [s3-emulation]
    stop_grace_period: 30s
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AKC_DEV_MINIO_USER:-akc-dev}
      MINIO_ROOT_PASSWORD: ${AKC_DEV_MINIO_PASSWORD:-akc_dev_only_change_me}
    ports:
      - "127.0.0.1:${AKC_DEV_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${AKC_DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [s3-emulation]
    networks: [akc]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AKC_DEV_MINIO_USER:-akc-dev}
      MINIO_ROOT_PASSWORD: ${AKC_DEV_MINIO_PASSWORD:-akc_dev_only_change_me}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for bucket in \
          akc-intake-quarantine \
          akc-source-private \
          akc-working-private \
          akc-derived-private \
          akc-exports-private \
          akc-audit-evidence; do
          mc mb --ignore-existing "local/$${bucket}"
          mc anonymous set none "local/$${bucket}"
        done

  clamav:
    <<: *service-defaults
    image: clamav/clamav:1.4.2
    ports:
      - "127.0.0.1:${AKC_DEV_CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test:
        ["CMD-SHELL", "printf 'PING\n' | nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  migrate:
    <<: *service-defaults
    restart: "no"
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      HOME: /tmp
      AKC_DATABASE_URL: postgresql+asyncpg://${AKC_DEV_POSTGRES_USER:-akc}:${AKC_DEV_POSTGRES_PASSWORD:-akc_dev_only_change_me}@postgres:5432/${AKC_DEV_POSTGRES_DB:-akc}
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1770,uid=10001,gid=10001

  api:
    <<: *service-defaults
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      AKC_ENV: development
      AKC_LOG_LEVEL: INFO
      AKC_DATABASE_URL: postgresql+asyncpg://${AKC_DEV_POSTGRES_USER:-akc}:${AKC_DEV_POSTGRES_PASSWORD:-akc_dev_only_change_me}@postgres:5432/${AKC_DEV_POSTGRES_DB:-akc}
      AKC_WEB_ORIGINS: http://localhost:${AKC_DEV_WEB_PORT:-3000}
      AKC_DATA_DIR: /var/lib/akc
      AKC_OBJECT_STORE_DRIVER: local
      AKC_MAX_UPLOAD_BYTES: "52428800"
      AKC_ANALYSIS_MAX_SOURCE_BYTES: "52428800"
      AKC_LOCAL_ANALYSIS_WORKER_ENABLED: "false"
      AKC_EXTERNAL_OCR_ENABLED: "false"
      AKC_PRIVATE_MODE: "true"
      AKC_ALLOW_PUBLIC_REGISTRATION: "true"
      AKC_URL_INGESTION_ENABLED: ${AKC_URL_INGESTION_ENABLED:-false}
      AKC_URL_ENCRYPTION_KEY: ${AKC_DEV_URL_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AKC_URL_QUERY_HMAC_SECRET: ${AKC_DEV_URL_QUERY_HMAC_SECRET:-akc-dev-url-query-hmac-secret-change-me}
      AKC_CLAMAV_ENABLED: "true"
      AKC_CLAMAV_HOST: clamav
      AKC_CLAMAV_PORT: "3310"
      AKC_CLAMAV_TIMEOUT_SECONDS: "20"
      AKC_ALLOW_DEVELOPMENT_ANTIVIRUS_BYPASS: "false"
      AKC_WEBHOOK_DELIVERY_ENABLED: "false"
      AKC_COOKIE_SECURE: "false"
      AKC_LOCAL_BACKGROUND_TASKS: "false"
      AKC_METRICS_ENABLED: "true"
      AKC_OTEL_ENABLED: "false"
    ports:
      - "127.0.0.1:${AKC_DEV_API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=268435456,mode=1770,uid=10001,gid=10001
    volumes:
      - api-data:/var/lib/akc

  scheduler:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    command: ["python", "-m", "akc_scheduler", "--mode", "webhook"]
    cap_drop: [ALL]
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      AKC_ENV: development
      AKC_LOG_LEVEL: INFO
      AKC_METRICS_ENABLED: "true"
      AKC_METRICS_BIND_HOST: 0.0.0.0
      AKC_METRICS_PORT: "9100"
      AKC_DATABASE_URL: postgresql+asyncpg://akc_scheduler_runtime:akc_scheduler_dev_only_change_me@postgres:5432/${AKC_DEV_POSTGRES_DB:-akc}
      AKC_SCHEDULER_DATABASE_ROLE: akc_scheduler
      AKC_SCHEDULER_POLL_INTERVAL_SECONDS: "0.5"
      AKC_SCHEDULER_BATCH_SIZE: "50"
      AKC_WEBHOOK_DELIVERY_ENABLED: ${AKC_WEBHOOK_DELIVERY_ENABLED:-false}
      AKC_WEBHOOK_ENCRYPTION_KEY: ${AKC_DEV_WEBHOOK_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AKC_WEBHOOK_ALLOWED_HOSTS: ${AKC_DEV_WEBHOOK_ALLOWED_HOSTS:-}
      AKC_WEBHOOK_ATTEMPT_TIMEOUT_SECONDS: "20"
      AKC_WEBHOOK_CONFIGURATION_RETRY_SECONDS: "60"
      AKC_WEBHOOK_MAX_RETRY_AFTER_SECONDS: "86400"
      AKC_SCHEDULER_RETENTION_INTERVAL_SECONDS: "3600"
      AKC_SCHEDULER_CLEANUP_BATCH_SIZE: "1000"
      AKC_OUTBOX_RETENTION_DAYS: "7"
      AKC_DISPATCH_DEAD_LETTER_RETENTION_DAYS: "30"
      AKC_WEBHOOK_DELIVERY_RETENTION_DAYS: "30"
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test:
        ["CMD", "python", "-m", "akc_scheduler", "--check", "--mode", "webhook"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=67108864,mode=1770,uid=10001,gid=10001

  dispatch-worker:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    command: ["python", "-m", "akc_scheduler", "--mode", "dispatch"]
    cap_drop: [ALL]
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      AKC_ENV: development
      AKC_LOG_LEVEL: INFO
      AKC_METRICS_ENABLED: "true"
      AKC_METRICS_BIND_HOST: 0.0.0.0
      AKC_METRICS_PORT: "9100"
      AKC_DATABASE_URL: postgresql+asyncpg://akc_dispatch_runtime:akc_dispatch_dev_only_change_me@postgres:5432/${AKC_DEV_POSTGRES_DB:-akc}
      AKC_DISPATCH_DATABASE_ROLE: akc_dispatch_worker
      AKC_SCHEDULER_POLL_INTERVAL_SECONDS: "0.5"
      AKC_SCHEDULER_BATCH_SIZE: "10"
      AKC_DISPATCH_MAX_ATTEMPTS: "5"
      AKC_DISPATCH_LEASE_SECONDS: "900"
      AKC_DISPATCH_ATTEMPT_TIMEOUT_SECONDS: "300"
      AKC_DISPATCH_BACKOFF_BASE_SECONDS: "2"
      AKC_DISPATCH_BACKOFF_MAX_SECONDS: "300"
      AKC_DISPATCH_BACKOFF_JITTER_RATIO: "0.2"
      AKC_KNOWLEDGE_PROVIDER: deterministic
      AKC_PRIVATE_MODE: "true"
      AKC_EXTERNAL_OCR_ENABLED: "false"
      AKC_WEBHOOK_DELIVERY_ENABLED: "false"
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:9101:9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "akc_scheduler",
          "--check",
          "--mode",
          "dispatch",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    read_only: true
    stop_grace_period: 330s
    tmpfs:
      - /tmp:size=268435456,mode=1770,uid=10001,gid=10001

  analysis-worker:
    <<: *service-defaults
    build:
      context: .
      dockerfile: workers/cpu-document/Dockerfile
    command: ["python", "-m", "akc_worker_document"]
    cap_drop: [ALL]
    pids_limit: 96
    mem_limit: 2g
    cpus: "2.0"
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      AWS_EC2_METADATA_DISABLED: "true"
      AKC_ENV: development
      AKC_LOG_LEVEL: INFO
      AKC_DATABASE_URL: postgresql+asyncpg://akc_analysis_runtime:akc_analysis_dev_only_change_me@postgres:5432/${AKC_DEV_POSTGRES_DB:-akc}
      AKC_ANALYSIS_DATABASE_ROLE: akc_analysis_worker
      AKC_DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      AKC_DATABASE_POOL_TIMEOUT_SECONDS: "5"
      AKC_DATABASE_COMMAND_TIMEOUT_SECONDS: "330"
      AKC_DATABASE_STATEMENT_TIMEOUT_MS: "325000"
      AKC_DATABASE_LOCK_TIMEOUT_MS: "5000"
      AKC_DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "340000"
      AKC_DATA_DIR: /var/lib/akc
      AKC_OBJECT_STORE_DRIVER: local
      AKC_MAX_UPLOAD_BYTES: "52428800"
      AKC_ANALYSIS_MAX_SOURCE_BYTES: "52428800"
      AKC_MAX_PAGES: "500"
      AKC_MAX_ARCHIVE_FILES: "2000"
      AKC_MAX_ARCHIVE_UNCOMPRESSED_BYTES: "262144000"
      AKC_MAX_ARCHIVE_RATIO: "100"
      AKC_PRIVATE_MODE: "true"
      AKC_ANALYSIS_SANDBOX_LAUNCHER: direct
      AKC_ANALYSIS_MAX_ATTEMPTS: "3"
      AKC_ANALYSIS_LEASE_SECONDS: "330"
      AKC_ANALYSIS_ATTEMPT_TIMEOUT_SECONDS: "300"
      AKC_ANALYSIS_BACKOFF_BASE_SECONDS: "2"
      AKC_ANALYSIS_BACKOFF_MAX_SECONDS: "120"
      AKC_ANALYSIS_CHILD_MEMORY_BYTES: "1610612736"
      AKC_ANALYSIS_CHILD_FILE_BYTES: "536870912"
      AKC_ANALYSIS_MAX_RESULT_BYTES: "134217728"
      AKC_PREVIEW_MAX_TOTAL_BYTES: "268435456"
      AKC_METRICS_ENABLED: "true"
      AKC_METRICS_BIND_HOST: 0.0.0.0
      AKC_METRICS_PORT: "9102"
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${AKC_DEV_ANALYSIS_METRICS_PORT:-9102}:9102"
    healthcheck:
      test: ["CMD", "python", "-m", "akc_worker_document", "--check"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    read_only: true
    stop_grace_period: 340s
    tmpfs:
      - /tmp:size=805306368,mode=1770,uid=10001,gid=10001
    volumes:
      - api-data:/var/lib/akc

  url-fetcher:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/url-fetcher/Dockerfile
    command: ["python", "-m", "akc_url_fetcher"]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: "1.0"
    environment:
      HOME: /tmp
      AWS_EC2_METADATA_DISABLED: "true"
      AKC_ENV: development
      AKC_LOG_LEVEL: INFO
      AKC_DATABASE_URL: postgresql+asyncpg://akc_url_fetcher_runtime:akc_url_fetcher_dev_only_change_me@postgres:5432/${AKC_DEV_POSTGRES_DB:-akc}
      AKC_URL_DATABASE_ROLE: akc_url_fetcher
      AKC_DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      AKC_DATABASE_POOL_TIMEOUT_SECONDS: "5"
      AKC_DATABASE_COMMAND_TIMEOUT_SECONDS: "60"
      AKC_DATABASE_STATEMENT_TIMEOUT_MS: "55000"
      AKC_DATABASE_LOCK_TIMEOUT_MS: "5000"
      AKC_DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      AKC_DATA_DIR: /var/lib/akc
      AKC_OBJECT_STORE_DRIVER: local
      AKC_URL_ENCRYPTION_KEY: ${AKC_DEV_URL_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AKC_URL_QUERY_HMAC_SECRET: ${AKC_DEV_URL_QUERY_HMAC_SECRET:-akc-dev-url-query-hmac-secret-change-me}
      AKC_URL_FETCH_MAX_BYTES: "52428800"
      AKC_URL_FETCH_CONNECT_TIMEOUT_SECONDS: "5"
      AKC_URL_FETCH_READ_TIMEOUT_SECONDS: "20"
      AKC_URL_FETCH_TOTAL_TIMEOUT_SECONDS: "30"
      AKC_URL_FETCH_MAX_REDIRECTS: "5"
      AKC_URL_FETCH_POLL_INTERVAL_SECONDS: "0.5"
      AKC_URL_FETCH_MAX_ATTEMPTS: "5"
      AKC_URL_FETCH_LEASE_SECONDS: "90"
      AKC_URL_FETCH_BACKOFF_BASE_SECONDS: "2"
      AKC_URL_FETCH_BACKOFF_MAX_SECONDS: "300"
      AKC_URL_FETCH_BACKOFF_JITTER_RATIO: "0.2"
      AKC_CLAMAV_ENABLED: "true"
      AKC_CLAMAV_HOST: clamav
      AKC_CLAMAV_PORT: "3310"
      AKC_CLAMAV_TIMEOUT_SECONDS: "20"
      AKC_ALLOW_DEVELOPMENT_ANTIVIRUS_BYPASS: "false"
      AKC_METRICS_ENABLED: "true"
      AKC_METRICS_BIND_HOST: 0.0.0.0
      AKC_METRICS_PORT: "9103"
    depends_on:
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    ports:
      - "127.0.0.1:${AKC_DEV_URL_FETCH_METRICS_PORT:-9103}:9103"
    healthcheck:
      test: ["CMD", "python", "-m", "akc_url_fetcher", "--check"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    read_only: true
    stop_grace_period: 120s
    tmpfs:
      - /tmp:size=536870912,mode=1770,uid=10001,gid=10001
    volumes:
      - api-data:/var/lib/akc

  web:
    <<: *service-defaults
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_AKC_API_URL: http://localhost:${AKC_DEV_API_PORT:-8000}
        NEXT_PUBLIC_AKC_DEMO_MODE: "false"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_AKC_API_URL: http://localhost:${AKC_DEV_API_PORT:-8000}
      NEXT_PUBLIC_AKC_DEMO_MODE: "false"
    ports:
      - "127.0.0.1:${AKC_DEV_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:size=67108864,mode=1770,uid=1001,gid=1001
      - /app/apps/web/.next/cache:size=268435456,mode=0770,uid=1001,gid=1001

networks:
  akc:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
  api-data:
